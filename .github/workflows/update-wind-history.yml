name: Update wind history

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Scheduled runs can overlap or land late. Without this, a run that started
# earlier can finish after a newer one and lose its push.
concurrency:
  group: wind-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-wind-history.mjs
      - run: node scripts/update-donki.mjs
      - run: node scripts/update-cactus.mjs
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wind-history data/donki data/cactus
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update wind history, DONKI FLR, and CACTUS data"
          # A plain push fails non-fast-forward when another run pushed first,
          # and that run's 5 minutes of data would be lost. Rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto origin."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
