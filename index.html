document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;cursor:pointer}.links-btn:hover{color:var(--text);background:rgba(255,255,255,.06)}.links-dropdown{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:20}.links-dropdown.open{display:block}.links-dropdown a{display:block;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px;white-space:nowrap}.links-dropdown a:hover{background:rgba(109,214,255,.12);color:var(--accent)}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 16px;border-radius:9px;font-size:17px}.nav button.active{background:linear-gradient(135deg,rgba(76,183,229,.26),rgba(77,231,179,.12));color:var(--text);box-shadow:inset 0 0 0 1px rgba(109,214,255,.38)}.view{display:none}.view.active{display:block}.hero-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{padding:13px 14px;border:1px solid var(--border);border-radius:13px;background:linear-gradient(180deg,rgba(18,30,48,.9),rgba(10,18,31,.9));min-height:98px}.metric-label{color:var(--muted);font-size:16px;margin-bottom:8px}.metric-value{font-size:clamp(23px,2.4vw,34px);font-weight:700;letter-spacing:-.03em}.metric-unit{font-size:16px;color:var(--muted);margin-left:5px}.metric-foot{margin-top:7px;color:var(--muted);font-size:15px}.section{border:1px solid var(--border);border-radius:17px;background:linear-gradient(180deg,rgba(13,22,37,.94),rgba(6,12,23,.96));padding:14px;margin-bottom:14px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:11px}.section-head h2{margin:0;font-size:26px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:16px}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.chart-card{border:1px solid var(--border);bord .<\u002Fdiv><\u002Fdiv><div class=\"solar-cycle-note\">NOAA SWPC가 제공하는 Experimental Solar Cycle 25 Prediction 이미지입니다. 검은색은 월별 관측값, 파란색은 평활 관측값이며, 보라색 영역은 향후 예측 구간을 나타냅니다.<\u002Fdiv><\u002Farticle>\n<\u002Fsection>\n<\u002Fsection>\n<section id=\"wind\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Solar Wind<\u002Fh2><p>NOAA SWPC RTSW <strong>Solar-1<\u002Fstrong> 1분 자료 · GitHub Actions로 누적한 최근 5일과 현재 이후 24시간 빈 구간<\u002Fp><div class=\"data-source-note\">Data source: <strong>NOAA SWPC RTSW Solar-1<\u002Fstrong> · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">Solar-wind plasma 원본 JSON<\u002Fa> · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">IMF 원본 JSON<\u002Fa><\u002Fdiv><\u002Fdiv><span class=\"interactive-hint\">모든 그래프가 동일 시간축 사용 · 각 그래프에 날짜·시간 X축 표시 · 현재선 오른쪽은 24시간 미래 빈 구간<\u002Fspan><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Wind Speed<\u002Fdiv><div class=\"chart-source\">km/s · 자료 범위에 따라 Y축 자동 확장 · 비정상 급락 제거 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-wind-speed\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap compact\"><canvas id=\"c-speed\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Proton Density<\u002Fdiv><div class=\"chart-source\">p/cm³ · Y축 자동 확장 · 열적 proton number density · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-density\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap compact\"><canvas id=\"c-density\"><\u002Fcanvas><\u002Fdiv><div class=\"scale-note\">Proton density는 태양풍 플라 002Fcanvas><\u002Fdiv><\u002Fdiv>\n<div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">WSA–ENLIL Heliospheric Forecast<\u002Fdiv><div class=\"chart-source\">NOAA SWPC ENLIL spatial-distribution image frames · hourly model animation<\u002Fdiv><\u002Fdiv><div id=\"v-enlil\" class=\"live-value\">FORECAST<\u002Fdiv><\u002Fdiv><div class=\"enlil-controls\"><button id=\"enlil-play\" type=\"button\">▶ 재생<\u002Fbutton><button id=\"enlil-prev\" type=\"button\" aria-label=\"Previous ENLIL frame\">◀<\u002Fbutton><button id=\"enlil-next\" type=\"button\" aria-label=\"Next ENLIL frame\">▶<\u002Fbutton><input id=\"enlil-slider\" type=\"range\" min=\"0\" max=\"0\" value=\"0\" step=\"1\" aria-label=\"ENLIL forecast frame\"><div id=\"enlil-readout\" class=\"enlil-readout\">영상 프레임 목록을 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"enlil-frame-shell\"><img id=\"enlil-image\" alt=\"NOAA WSA-ENLIL heliospheric forecast spatial distribution\"><div id=\"enlil-frame-status\" class=\"enlil-frame-status\">ENLIL 공간 분포 영상을 불러오는 중...<\u002Fdiv><div id=\"enlil-time-badge\" class=\"enlil-time-badge\">-- UTC<\u002Fdiv><\u002Fdiv><div class=\"enlil-note\">NOAA가 제공하는 WSA–ENLIL 공간 분포 JPEG 프레임을 시간 순서대로 재생합니다. 프레임 목록이 갱신되지 않았거나 이미지 서버가 응답하지 않으면 마지막으로 공개된 모델 실행 시각까지만 표시됩니다. 이미지를 클릭하면 확대됩니다.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"geomag\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Geomagnetic Activity<\u002Fh2><p>Planetary Kp, GFZ Hp30, Geospace Dst를 시간축으로 비교<\u002Fp><\u002Fdiv><span class=\"interactive-hint\">공통 커서와 현재 시각 표시<\u002Fspan><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Planetary Kp<\u002Fdiv><div class=\"chart-source\">우측 라벨: NOAA G-scale 기준 G1(Kp 5)–G5(Kp 9) · <a href=\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-kp2\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-kp2\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">GFZ Hp30 Index<\u002Fdiv><div class=\"chart-source\" id=\"hp30-source-status\">30분 해상도 · 최근 7일 · <a id=\"hp30-source-link\" href=\"https://kp.gfz.de/en/hp30-hp60\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">GFZ 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-hp30\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-hp30\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Dst Index<\u002Fdiv><div class=\"chart-source\">nT · <a href=\"https://services.swpc.noaa.gov/json/geospace/geospace_dst_7_day.json\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-dst\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-dst\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"radiation\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Energetic Particle Flux<\u002Fh2><p>GOES integral proton and electron flux · 최근 7일<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Integral Proton Flux<\u002Fdiv><div class=\"chart-source\">GOES primary · NOAA S-scale는 ≥10 MeV 채널 기준 · <a href=\"https://services.swpc.noaa.gov/json/goes/primary/integral-protons-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-proton\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-proton\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Integral Electron Flux<\u002Fdiv><div class=\"chart-source\">GOES secondary · ≥0.8 MeV and ≥2 MeV · electrons/(cm²·s·sr) · <a href=\"https://services.swpc.noaa.gov/json/goes/secondary/integral-electrons-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-electron\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-electron\"><\u002Fcanvas><\u002Fdiv><div class=\"scale-note\">NOAA electron alert 기준은 ≥2 MeV flux 1,000 electrons/(cm²·s·sr)입니다. 강한 proton event 동안 ≥2 MeV electron 채널이 오염될 수 있습니다.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"ionosphere\" class=\"view\">\n  <section class=\"section\">\n    <div class=\"section-head\">\n      <div><h2>Global Ionosphere<\u002Fh2><p>NOAA SWPC GloTEC ultra-real-time global ionospheric specification<\u002Fp><\u002Fdiv>\n      <button id=\"reload-ionosphere\" type=\"button\">전리권 자료 새로고침<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"iono-toolbar\">\n      <div id=\"iono-time\" class=\"iono-time\">최신 GloTEC 자료 탐색 중...<\u002Fdiv>\n      <div id=\"iono-status\" class=\"iono-status\">GeoJSON 파일을 확인하고 있습니다.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"iono-controls\" aria-label=\"Ionosphere map controls\">\n      <div class=\"iono-control\"><span>보간 해상도<\u002Fspan><select id=\"iono-resolution\"><option value=\"1\">1×<\u002Foption><option value=\"2\" selected=\"\">2×<\u002Foption><option value=\"4\">4×<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"iono-control\"><span>Gaussian<\u002Fspan><input id=\"iono-smoothing\" type=\"range\" min=\"0\" max=\"5\" step=\"1\" value=\"2\"><output id=\"iono-smoothing-value\">2<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><span>채움 투명도<\u002Fspan><input id=\"iono-opacity\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"100\"><output id=\"iono-opacity-value\">100%<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><span>Contour<\u002Fspan><select id=\"iono-contours\"><option value=\"0\">없음<\u002Foption><option value=\"6\">6<\u002Foption><option value=\"10\" selected=\"\">10<\u002Foption><option value=\"14\">14<\u002Foption><option value=\"20\">20<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"iono-control\"><span>선 투명도<\u002Fspan><input id=\"iono-contour-alpha\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"50\"><output id=\"iono-contour-alpha-value\">50%<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-labels\" type=\"checkbox\" checked=\"\"> Contour 라벨<\u002Flabel><\u002Fdiv><div class=\"iono-control\"><label><input id=\"iono-show-map\" type=\"checkbox\" checked=\"\"> 대륙 해안선<\u002Flabel><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-grid\" type=\"checkbox\" checked=\"\"> 위·경도 격자<\u002Flabel><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-points\" type=\"checkbox\"> 원본 격자점<\u002Flabel><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"iono-grid\">\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global Total Electron Content<\u002Fdiv><div class=\"chart-source\">Vertical TEC · TECU · <a id=\"iono-source-tec\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-tec-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-tec\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">TEC는 위성–수신기 경로의 전자 수를 수직 방향으로 환산한 총전자량입니다. 1 TECU = 10¹⁶ electrons/m².<\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global NmF2<\u002Fdiv><div class=\"chart-source\">F2-layer peak electron density · <a id=\"iono-source-nmf2\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-nmf2-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-nmf2\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">NmF2는 전리권 F2층 최대 전자밀도입니다. 자료값이 m⁻³ 단위이면 지도에는 10¹² m⁻³ 단위로 환산해 표시합니다.<\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global hmF2<\u002Fdiv><div class=\"chart-source\">F2-layer peak height · km · <a id=\"iono-source-hmf2\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-hmf2-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-hmf2\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">hmF2는 F2층 최대 전자밀도가 나타나는 고도입니다.<\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsection>\n<section id=\"imagery\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Latest Solar Images<\u002Fh2><p>NOAA GOES/SUVI 및 SDO AIA/HMI 최신 영상 · 클릭하면 확대<\u002Fp><\u002Fdiv><button id=\"reload-solar-images\" type=\"button\">이미지 다시 불러오기<\u002Fbutton><\u002Fdiv><div class=\"images\"><article class=\"image-card\" data-label=\"GOES SUVI 171 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/171/latest.png\" alt=\"Latest GOES SUVI 171 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI 171 Å · quiet corona · <a href=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/171/latest.png\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002F 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/AIA 1600 Å · transition region/upper photosphere · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_1600.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO HMI Continuum\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/sdo-hmii/latest.jpg\" alt=\"Latest SDO HMI continuum image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/HMI continuum · photosphere · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIIC.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO HMI Magnetogram\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIB.jpg\" alt=\"Latest SDO HMI magnetogram image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/HMI magnetogram · photospheric magnetic field · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIB.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"GOES SUVI Thematic Map\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/secondary/map/latest.png\" alt=\"Latest GOES SUVI thematic map\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI Thematic Map · <a href=\"https://services.swpc.noaa.gov/images/animations/suvi/secondary/map/latest.png\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"aurora\" class=\"view\"><div class=\"iframe-shell\"><div class=\"iframe-bar\"><div><strong>OVATION Aurora Monitoring<\u002Fstrong><br><span>Geographic probability + MLT–MLAT energy flux<\u002Fspan><\u002Fdiv><button id=\"open-aurora\">새 탭에서 열기 ↗<\u002Fbutton><\u002Fdiv><iframe id=\"aurora-frame\" src=\"about:blank#f94ef46c-14ee-44ed-aae4-9ddabf6c154c\" title=\"OVATION Aurora Monitoring\"><\u002Fiframe><\u002Fdiv><\u002Fsection>\n<footer class=\"footer\">Data sources: NOAA SWPC planetary K-index, Geospace Dst, RTSW solar wind and magnetic field, GOES X-ray, proton, and electron feeds, GloTEC ionosphere GeoJSON; NASA SDO latest imagery; GFZ Kp and Hp30 index.<\u002Ffooter>\n<\u002Fmain>\n<div id=\"modal\" class=\"modal\"><div class=\"modal-inner\"><button id=\"modal-close\">닫기<\u002Fbutton><img id=\"modal-img\" alt=\"Expanded solar image\"><\u002Fdiv><\u002Fdiv>\n<div id=\"cactus-modal\" class=\"modal\"><div class=\"modal-inner cactus-modal-inner\"><button id=\"cactus-modal-close\">닫기<\u002Fbutton><div id=\"cactus-modal-body\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<script async=\"\" src=\"0356224f-f5a2-4945-a445-b50469c9d9e0\" onload=\"window.dispatchEvent(new Event('topojsonready'))\"><\u002Fscript>\n<script>\n\"use strict\";\nconst URL={scales:\"https://services.swpc.noaa.gov/products/noaa-scales.json\",kp:\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json\",kpForecast:\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json\",dst:\"https://services.swpc.noaa.gov/json/geospace/geospace_dst_7_day.json\",wind:\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\",mag:\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\",xray:\"https://services.swpc.noaa.gov/json/goes/primary/xrays-7-day.json\",xrayFallback:\"https://services.swpc.noaa.gov/json/goes/primary/xrays-1-day.json\",proton:\"https://services.swpc.noaa.gov/json/goes/primary/integral-protons-7-day.json\",electron:\"https://services.swpc.noaa.gov/json/goes/secondary/integral-electrons-7-day.json\",glotecManifest:\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt.json\",glotecBase:\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\",enlil:\"https://services.swpc.noaa.gov/products/animations/enlil.json\"};\nconst state={data:{},loading:false,enlilIndex:0,enlilPlaying:false,enlilTimer:null};const $=id=>document.getElementById(id);\nfunction donkiRange(days){const end=new Date(),start=new Date(end.getTime()-days*864e5),f=x=>x.toISOString().slice(0,10);return {start:f(start),end:f(end)}}\nfunction buildDonkiUrl(type,days=3){const {start,end}=donkiRange(days);return `https://kauai.ccmc.gsfc.nasa.gov/DONKI/WS/get/${type}?startDate=${start}&endDate=${end}`}\nfunction fetchDonki(type,days=3){\n  const local=`./data/donki/${type.toLowerCase()}.json`;\n  const direct=buildDonkiUrl(type,days),nonce=Date.now();\n  const fallbacks=[`${local}?t=${nonce}`,direct,`https://api.allorigins.win/raw?url=${encodeURIComponent(direct)}&cache=${nonce}`,`https://corsproxy.io/?url=${encodeURIComponent(direct)}&cache=${nonce}`];\n  return safeFetchAny(fallbacks);\n}\nfunction parseCactusText(text){\n  const out=[];let inFlow=false;\n  for(const raw of String(text||'').split('\\n')){\n    const line=raw.trim();if(!line)continue;\n    if(/^#\\s*Flow\\s*\\|/i.test(line)){inFlow=true;continue}\n    if(inFlow||line.startsWith('#')||line.startsWith(':'))continue;\n    const parts=line.split('|').map(s=>s.trim());\n    if(parts.length<9||!/^\\d+$/.test(parts[0]))continue;\n    const [numStr,t0Str,dt0,pa,da,v,dv,minv,maxv,halo]=parts;\n    const t0=Date.parse(t0Str.replace(/\\//g,'-').replace(' ','T')+':00Z');\n    if(!Number.isFinite(t0))continue;\n    out.push({cme:numStr,t0,dt0:Number(dt0),pa:Number(pa),da:Number(da),v:Number(v),dv:Number(dv),minv:Number(minv),maxv:Number(maxv),halo:(halo||'').trim()||null});\n  }\n  return out.sort((a,b)=>b.t0-a.t0);\n}\nasync function fetchCactus(){\n  const nonce=Date.now();\n  try{const r=await fetch(`./data/cactus/cmecat.json?t=${nonce}`,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}\n  const direct='https://www.sidc.be/cactus/out/cmecat.txt';\n  const urls=[direct,`https://api.allorigins.win/raw?url=${encodeURIComponent(direct)}&cache=${nonce}`,`https://corsproxy.io/?url=${encodeURIComponent(direct)}&cache=${nonce}`];\n  let lastError=null;\n  for(const u of urls){\n    try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return parseCactusText(await r.text())}catch(e){lastError=e}\n  }\n  throw lastError||new Error('CACTUS unavailable');\n}\nfunction detectEpisodes(series,threshold,mergeGapMs){\n  const pts=(series||[]).filter(p=>Number.isFinite(p.v)&&p.v>=threshold).sort((a,b)=>a.t-b.t);\n  const episodes=[];\n  for(const p of pts){\n    const last=episodes[episodes.length-1];\n    if(last&&p.t-last.end<=mergeGapMs){last.end=p.t;last.max=Math.max(last.max,p.v)}\n    else episodes.push({start:p.t,end:p.t,max:p.v});\n  }\n  return episodes;\n}\nfunction gScale(kp){return kp>=9?'G5':kp>=8?'G4':kp>=7?'G3':kp>=6?'G2':kp>=5?'G1':null}\nfunction sScale(pfu){return pfu>=1e5?'S5':pfu>=1e4?'S4':pfu>=1e3?'S3':pfu>=100?'S2':pfu>=10?'S1':null}\nfunction openCactusModal(){\n  const box=$('cactus-modal-body'),d=state.data,cutoff=Date.now()-5*864e5;\n  const cme=(d.cme||[]).filter(e=>e.t0>=cutoff).slice().sort((a,b)=>b.t0-a.t0);\n  const rows=cme.length?cme.map(e=>`<tr><td>${e.cme}<\u002Ftd><td>${new Date(e.t0).toISOString().slice(0,16).replace('T',' ')}<\u002Ftd><td>${e.dt0}<\u002Ftd><td>${e.pa}<\u002Ftd><td>${e.da}<\u002Ftd><td>${e.v}<\u002Ftd><td>${e.dv}<\u002Ftd><td>${e.minv}<\u002Ftd><td>${e.maxv}<\u002Ftd><td>${e.halo||'-'}<\u002Ftd><\u002Ftr>`).join(''):'<tr><td colspan=\"10\">최근 3일 내 CACTUS CME 검출 없음<\u002Ftd><\u002Ftr>';\n  box.innerHTML=`<h4 style=\"margin:0 0 10px\">CACTUS CME 목록 (최근 5일)<\u002Fh4><div style=\"overflow-x:auto\"><table class=\"cactus-table\"><thead><tr><th>#<\u002Fth><th>t0 (UTC)<\u002Fth><th>dt0(h)<\u002Fth><th>PA(°)<\u002Fth><th>da(°)<\u002Fth><th>v(km/s)<\u002Fth><th>dv<\u002Fth><th>minv<\u002Fth><th>maxv<\u002Fth><th>halo<\u002Fth><\u002Ftr><\u002Fthead><tbody>${rows}<\u002Ftbody><\u002Ftable><\u002Fdiv><div class=\"data-source-note\" style=\"margin-top:10px\">SIDC CACTUS 자동 CME 검출 카탈로그(LASCO C2/C3). 자동 알고리즘 결과라 노이즈성 오검출이 섞일 수 있습니다.<br><a href=\"https://www.sidc.be/cactus/out/cmecat.txt\" target=\"_blank\" rel=\"noopener\">cmecat.txt ↗<\u002Fa> · <a href=\"https://www.sidc.be/cactus/\" target=\"_blank\" rel=\"noopener\">CACTUS ↗<\u002Fa><\u002Fdiv>`;\n  $('cactus-modal').classList.add('open');\n}\nfunction renderDonki(d){\n  const failed=new Set(d.failedSources||[]);\n  const failNote='<div class=\"event-empty\">데이터를 불러오지 못했습니다 · 다음 새로고침에 재시도<\u002Fdiv>';\n  const cmeList=$('cme-list'),flrList=$('flr-list');if(!cmeList||!flrList)return;\n  const cactusCutoff=Date.now()-5*864e5;\n  const cme=(d.cme||[]).filter(e=>e.t0>=cactusCutoff).slice().sort((a,b)=>b.t0-a.t0);\n  const flr=(d.flr||[]).slice().sort((a,b)=>new Date(b.beginTime)-new Date(a.beginTime)).slice(0,6);\n  cmeList.innerHTML=failed.has('cme')&&!cme.length?failNote:cme.length?cme.map(e=>{\n    const t=new Date(e.t0).toISOString().slice(0,16).replace('T',' ')+' UTC';\n    const haloBadge=e.halo?` · <span style=\"color:#ff9d50;font-weight:700\">HALO ${e.halo}<\u002Fspan>`:'';\n    return `<div class=\"event-item\">CME #${e.cme} · ${e.v} km/s · ${t} · PA ${e.pa}° · width ${e.da}°${haloBadge}<\u002Fdiv>`;\n  }).join(''):'<div class=\"event-empty\">최근 5일 내 CACTUS CME 검출 없음<\u002Fdiv>';\n  if(cmeList&&!cmeList.dataset.zoomBound){cmeList.dataset.zoomBound='1';cmeList.style.cursor='pointer';cmeList.addEventListener('click',()=>openCactusModal())}\n  flrList.innerHTML=failed.has('flr')&&!flr.length?failNote:flr.length?flr.map(e=>{\n    const t=e.beginTime?new Date(e.beginTime).toISOString().slice(0,16).replace('T',' ')+' UTC':'--';\n    return `<div class=\"event-item\">${e.classType||'?'} 플레어 · ${t} · AR${e.activeRegionNum||'-'}<\u002Fdiv>`;\n  }).join(''):'<div class=\"event-empty\">최근 7일 내 주요 플레어 없음<\u002Fdiv>';\n  const gstList=$('gst-list'),sepList=$('sep-list');\n  if(gstList){\n    const kpFailed=failed.has('kp');\n    const recentKp=(d.kp||[]).filter(p=>p.t>Date.now()-5*864e5);\n    const episodes=detectEpisodes(recentKp,5,6*36e5).sort((a,b)=>b.start-a.start).slice(0,6);\n    gstList.innerHTML=kpFailed&&!episodes.length?failNote:episodes.length?episodes.map(e=>{\n      const g=gScale(e.max);\n      const t=new Date(e.start).toISOString().slice(0,16).replace('T',' ')+' UTC';\n      return `<div class=\"event-item\">${g} 지자기폭풍 · Kp ${e.max.toFixed(1)} · 시작 ${t}<\u002Fdiv>`;\n    }).join(''):'<div class=\"event-empty\">최근 5일 내 G1 이상 지자기폭풍 없음<\u002Fdiv>';\n  }\n  if(sepList){\n    const protonFailed=failed.has('proton');\n    const recentProton=(d.proton||[]).filter(p=>p.t>Date.now()-5*864e5);\n    const episodes=detectEpisodes(recentProton,10,2*36e5).sort((a,b)=>b.start-a.start).slice(0,6);\n    sepList.innerHTML=protonFailed&&!episodes.length?failNote:episodes.length?episodes.map(e=>{\n      const s=sScale(e.max);\n      const t=new Date(e.start).toISOString().slice(0,16).replace('T',' ')+' UTC';\n      return `<div class=\"event-item\">${s} 방사선폭풍 · ${e.max.toFixed(0)} pfu · 시작 ${t}<\u002Fdiv>`;\n    }).join(''):'<div class=\"event-empty\">최근 5일 내 S1 이상 방사선폭풍 없음<\u002Fdiv>';\n  }\n  const status=$('donki-time');if(status)status.textContent=`업데이트: ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`;\n}\nfunction parseUtc(v){if(!v)return NaN;const s=/Z$|[+-]\\d\\d:?\\d\\d$/.test(v)?v:v+\"Z\";return new Date(s).getTime()}\nasync function safeFetch(url,timeoutMs=20000){\n  const controller=new AbortController();\n  const timer=setTimeout(()=>controller.abort(),timeoutMs);\n  try{\n    const r=await fetch(url,{cache:\"no-store\",signal:controller.signal});\n    if(!r.ok)throw new Error(`${r.status} ${url}`);\n    const t=await r.text();\n    try{return JSON.parse(t)}catch(e){\n      const a=t.lastIndexOf(\"]\"),o=t.lastIndexOf(\"}\");\n      const i=Math.max(a,o);\n      if(i<0)throw new Error(`Invalid JSON: ${url}`);\n      return JSON.parse(t.slice(0,i+1));\n    }\n  }finally{clearTimeout(timer)}\n}\nasync function safeFetchAny(urls){\n  let lastError=null;\n  for(const url of urls){\n    try{return await safeFetch(url)}catch(e){lastError=e;console.warn('Source failed',url,e)}\n  }\n  throw lastError||new Error('No source URL available');\n}\nfunction activeRows(rows,fields){const seen=new Set(),out=[];for(const r of rows){if(!r.active||seen.has(r.time_tag))continue;seen.add(r.time_tag);const p={t:parseUtc(r.time_tag)};for(const f of fields)p[f]=Number(r[f]);out.push(p)}return out.sort((a,b)=>a.t-b.t)}\nfunction points(rows,key,filter=()=>true,transform=v=>v){return rows.filter(filter).map(r=>({t:parseUtc(r.time_tag),v:transform(Number(r[key]))})).filter(p=>Number.isFinite(p.t)&&Number.isFinite(p.v)).sort((a,b)=>a.t-b.t)}\nfunction median(values){\n  const a=values.filter(Number.isFinite).sort((x,y)=>x-y);\n  if(!a.length)return NaN;\n  const m=Math.floor(a.length/2);\n  return a.length%2?a[m]:(a[m-1]+a[m])/2;\n}\nfunction filterDownwardOutliers(data,{physicalMin,ratio,absoluteDrop,window=7}){\n  if(!Array.isArray(data)||data.length<5)return data||[];\n  const kept=[];\n  for(let i=0;i<data.length;i++){\n    const p=data[i];\n    if(!Number.isFinite(p.v)||p.v<physicalMin)continue;\n    const lo=Math.max(0,i-window),hi=Math.min(data.length,i+window+1);\n    const neighborhood=[];\n    for(let j=lo;j<hi;j++){\n      if(j===i)continue;\n      const v=data[j].v;\n      if(Number.isFinite(v)&&v>=physicalMin)neighborhood.push(v);\n    }\n    const localMedian=median(neighborhood);\n    const isSharpDrop=Number.isFinite(localMedian)&&p.v<localMedian*ratio&&(localMedian-p.v)>absoluteDrop;\n    if(!isSharpDrop)kept.push(p);\n  }\n  return kept;\n}\nfunction latestPoint(a){return a&&a.length?a[a.length-1]:null}function latest(a){const p=latestPoint(a);return p?p.v:NaN}function fmt(v,n=1){return Number.isFinite(v)?v.toFixed(n):\"--\"}\nfunction setStatus(text,type=\"normal\"){$(\"status-text\").textContent=text;$('status-dot').className='dot'+(type==='good'?' good':type==='error'?' error':'')}\nfunction setCanvasSize(c){const d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=Math.max(300,Math.floor(r.width*d));c.height=Math.max(180,Math.floor(r.height*d));return {ctx:c.getContext('2d'),W:c.width,H:c.height,d}}\nfunction niceRange(values,zero=false){let lo=Math.min(...values),hi=Math.max(...values);if(!Number.isFinite(lo)||!Number.isFinite(hi)){lo=0;hi=1}if(zero)lo=Math.min(0,lo);if(lo===hi){lo-=1;hi+=1}const pad=(hi-lo)*.12;return [lo-pad,hi+pad]}\nconst chartGroups={overview:{hover:null,ids:['c-kp','c-overview-dst','c-overview-wind','c-overview-bz','c-overview-xray','c-overview-proton']},wind:{hover:null,ids:['c-speed','c-density','c-bt','c-bx','c-by','c-bz']},geomag:{hover:null,ids:['c-kp2','c-hp30','c-dst']},solar:{hover:null,ids:['c-xray']},radiation:{hover:null,ids:['c-proton','c-electron']}};\nconst groupMargins={overview:{l:76,r:92},wind:{l:76,r:92},geomag:{l:76,r:92},solar:{l:76,r:92},radiation:{l:76,r:108}};\nconst FUTURE_WINDOW_MS=24*60*60*1000;\nconst WIND_CACHE_KEY='swx-wind-history-v1',WIND_CACHE_DAYS=5,WIND_HISTORY_DIR='./data/wind-history';\nfunction readWindCache(){try{const x=JSON.parse(localStorage.getItem(WIND_CACHE_KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(e){console.warn('Wind cache read failed',e);return {}}}\nfunction mergeHistory(oldSeries,newSeries,days=WIND_CACHE_DAYS,bounds=null){const cutoff=Date.now()-days*864e5,m=new Map();for(const p of [...(Array.isArray(oldSeries)?oldSeries:[]),...(Array.isArray(newSeries)?newSeries:[])]){if(Number.isFinite(p?.t)&&Number.isFinite(p?.v)&&p.t>=cutoff&&(!bounds||(p.v>=bounds[0]&&p.v<=bounds[1])))m.set(p.t,{t:p.t,v:p.v})}return [...m.values()].sort((a,b)=>a.t-b.t)}\nfunction saveWindCache(cache){try{localStorage.setItem(WIND_CACHE_KEY,JSON.stringify(cache))}catch(e){console.warn('Wind cache save failed',e)}}\nlet repoWindHistoryPromise=null;\nfunction loadRepoWindHistory(){\n  if(repoWindHistoryPromise)return repoWindHistoryPromise;\n  const bounds={speed:[100,3000],density:[0.05,500],bt:[0,300],bx:[-300,300],by:[-300,300],bz:[-300,300]};\n  repoWindHistoryPromise=(async()=>{\n    const out={speed:[],density:[],bt:[],bx:[],by:[],bz:[]};\n    try{\n      const manifestRes=await fetch(`${WIND_HISTORY_DIR}/manifest.json?t=${Date.now()}`,{cache:'no-store'});\n      if(!manifestRes.ok)return out;\n      const days=await manifestRes.json();\n      const recentDays=(Array.isArray(days)?days:[]).slice(-WIND_CACHE_DAYS);\n      const texts=await Promise.all(recentDays.map(d=>fetch(`${WIND_HISTORY_DIR}/${d}.jsonl?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.ok?r.text():'').catch(()=>'')));\n      for(const text of texts){\n        for(const line of text.split('\\n')){\n          if(!line.trim())continue;\n          let p;try{p=JSON.parse(line)}catch(e){continue}\n          if(!Number.isFinite(p.t))continue;\n          for(const k of ['speed','density','bt','bx','by','bz']){const v=p[k],[lo,hi]=bounds[k];if(Number.isFinite(v)&&v>=lo&&v<=hi)out[k].push({t:p.t,v})}\n        }\n      }\n    }catch(e){console.warn('Repo wind history load failed',e)}\n    return out;\n  })();\n  return repoWindHistoryPromise;\n}\nconst chartSpecs={};\nfunction drawPowerTick(ctx,x,y,exp,scale,align='right'){\n  ctx.save();ctx.fillStyle='#9eb1c8';ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=`${17*scale}px sans-serif`;\n  const base='10',baseW=ctx.measureText(base).width,expText=String(Math.round(exp));\n  if(align==='right'){\n    ctx.fillText(base,x-ctx.measureText(expText).width*.65,y+2*scale);\n    ctx.font=`${16*scale}px sans-serif`;ctx.textBaseline='alphabetic';ctx.fillText(expText,x,y-2*scale);\n  }else{\n    ctx.f ort(){try{const r=await fetch('https://services.swpc.noaa.gov/json/sunspot_report.json?t='+Date.now(),{cache:'no-store'});sunspotReportData=await r.json()}catch(e){console.warn('sunspot_report failed',e);sunspotReportData=[]}}\nasync function loadSolarRegions(){\n  const status=document.getElementById('solar-regions-status');\n  try{\n    status.textContent='Updating...';const res=await fetch('https://services.swpc.noaa.gov/json/solar_regions.json?t='+Date.now(),{cache:'no-store'}),data=await res.json();\n    const rawRows=Array.isArray(data)?data:[];const norm=rawRows.map(normalizeRegion).filter(r=>r.ar!=='-');solarRegionHistoryData=rawRows;\n    const latestDate=norm.map(r=>r.observed.slice(0,10)).filter(Boolean).sort().pop()||'';\n    const candidates=latestDate?norm.filter(r=>r.observed.startsWith(latestDate)):norm;\n    const byAr=new Map();for(const r of candidates){const old=byAr.get(String(r.ar));if(!old||r.observed>old.observed)byAr.set(String(r.ar),r)}\n    solarRegionsData=[...byAr.values()].sort((a,b)=>(b.x*100+b.m*10+b.area)-(a.x*100+a.m*10+a.area));\n    renderRegionCards();drawSolarDisk();status.textContent=`Updated · ${solarRegionsData.length} active regions · ${latestDate||'latest'}`;\n    if(solarRegionsData.length){const keep=solarRegionsData.find(r=>selectedRegion&&String(r.ar)===String(selectedRegion.ar));showRegionDetail(keep||solarRegionsData[0])}\n  }catch(e){status.textContent='Failed to load active regions';console.error(e)}\n}\nconst disk=document.getElementById('solar-disk');if(disk){disk.addEventListener('mousemove',ev=>{const r=disk.getBoundingClientRect(),x=(ev.clientX-r.left)*(disk.width/r.width),y=(ev.clientY-r.top)*(disk.height/r.height);disk.style.cursor=(disk._markers||[]).some(m=>Math.hypot(m.x-x,m.y-y)<=m.r)?'pointer':'zoom-in'});disk.addEventListener('click',ev=>{const r=disk.getBoundingClientRect(),x=(ev.clientX-r.left)*(disk.width/r.width),y=(ev.clientY-r.top)*(disk.height/r.height),hit=(disk._markers||[]).find(m=>Math.hypot(m.x-x,m.y-y)<=m.r);if(hit){showRegionDetail(hit.data);return}const img=document.getElementById('solar-disk-image');if(img&&img.src){document.getElementById('modal-img').src=img.src;document.getElementById('modal-img').alt='Latest NASA SDO HMI continuum solar disk';document.getElementById('modal').classList.add('open')}})}\nloadSolarProbabilities();\nPromise.allSettled([loadSunspotReport(),loadSolarRegions()]).then(()=>loadSolarRegions());\nloadSolarDiskImage();\nsetInterval(loadSolarProbabilities,30*60*1000);setInterval(()=>{loadSunspotReport().then(loadSolarRegions)},60*60*1000);setInterval(loadSolarDiskImage,10*60*1000);\n\nwindow.addEventListener('resize',()=>requestAnimationFrame(()=>drawSolarDisk()));\nsetTimeout(()=>drawSolarDisk(),1500);\nsetTimeout(()=>drawSolarDisk(),3500);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
