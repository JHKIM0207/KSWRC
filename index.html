  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Dst Index<\u002Fdiv><div class=\"chart-source\">NOAA Real-time Geospace model Dst<\u002Fdiv><\u002Fdiv><div id=\"v-dst-overview\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-overview-dst\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"geomag\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section class=\"section\"><div class=\"section-head\"><div><h2>Latest event list<\u002Fh2><\u002Fdiv><span id=\"donki-time\" class=\"chart-source\">--<\u002Fspan><\u002Fdiv><div class=\"event-grid\"><div class=\"event-col\"><h4>Coronal Mass Ejections<\u002Fh4><div class=\"scale-note\" style=\"margin:-4px 0 6px\">SIDC CACTUS 자동 검출 · 클릭하면 5일치 전체 목록<\u002Fdiv><div id=\"cme-list\" class=\"event-list\"><\u002Fdiv><\u002Fdiv><div class=\"event-col\"><h4>Solar Flares<\u002Fh4><div id=\"flr-list\" class=\"event-list\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"event-grid event-grid-3\"><div class=\"event-col\"><h4>Geomagnetic Storms<\u002Fh4><div class=\"scale-note\" style=\"margin:-4px 0 6px\">NOAA Kp 실시간 자동 감지 (G1+)<\u002Fdiv><div id=\"gst-list\" class=\"event-list\"><\u002Fdiv><\u002Fdiv><div class=\"event-col\"><h4>Solar Proton Events<\u002Fh4><div class=\"scale-note\" style=\"margin:-4px 0 6px\">NOAA proton flux 실시간 자동 감지 (S1+)<\u002Fdiv><div id=\"sep-list\" class=\"event-list\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<\u002Fsection>\n\n<section id=\"solar\" class=\"view\">\n<section class=\"section\">\n  <div class=\"section-head\"><div><h2>Solar X-ray Activity<\u002Fh2><p>GOES 0.1–0.8 nm soft X-ray flux · logarithmic scale · <a href=\"https://services.swpc.noaa.gov/json/goes/primary/xrays-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fp><\u002Fdiv><div id=\"v-xray\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n  <div class=\"chart-card\"><div class=\"canvas-wrap tall\"><canvas id=\"c-xray\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section class=\"section\">\n  <div class=\"section-head\"><div><h2>3-Day Flare &amp; Proton Forecast<\u002Fh2><p>NOAA SWPC 전 태양면 C/M/X급 플레어 및 ≥10 MeV proton event 확률<\u002Fp><\u002Fdiv><span id=\"solar-probabilities-status\" class=\"chart-source\">불러오는 중...<\u002Fspan><\u002Fdiv>\n  <div id=\"solar-probabilities-panel\" class=\"forecast-grid\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"section\">\n  <div class=\"section-head\"><div><h2>Active Solar Regions<\u002Fh2><p>현재 NOAA 활동영역의 위치, 복잡도 및 플레어 잠재력<\u002Fp><\u002Fdiv><span id=\"solar-regions-status\" class=\"chart-source\">불러오는 중...<\u002Fspan><\u002Fdiv>\n  <div id=\"solar-regions-panel\" class=\"regions-grid\"><\u002Fdiv>\n            <div class=\"solar-disk-wrap\">\n              <div class=\"solar-disk-panel\">\n                <h4 style=\"margin:0 0 8px;font-size:20px\">Active Regions on Solar Disk<\u002Fh4>\n                <div class=\"solar-image-stage\">\n                  <img id=\"solar-disk-image\" alt=\"Latest NASA SDO HMI continuum solar image\" referrerpolicy=\"no-referrer\">\n                  <canvas id=\"solar-disk\" width=\"1200\" height=\"1200\"><\u002Fcanvas><div id=\"solar-region-label-layer\" aria-label=\"Active region labels\"><\u002Fdiv><svg id=\"solar-region-overlay\" viewBox=\"0 0 1000 1000\" preserveAspectRatio=\"none\" aria-label=\"Active region labels\"><\u002Fsvg>\n                  <div id=\"solar-disk-image-status\" class=\"disk-image-status\">최신 HMI 영상 불러오는 중...<\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"disk-help\">NOAA Stonyhurst coordinates projected onto the solar-north-up HMI disk using the current solar B0. Click an empty area to enlarge the image.<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"region-detail\" id=\"region-detail-panel\">\n                <h4>Select an active region<\u002Fh4>\n                <div class=\"muted\">Click a marker on the solar disk or a region card below to view recent sunspot report trends.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n<\u002Fsection>\n<section class=\"section\">\n  <article class=\"solar-cycle-card\"><div class=\"solar-cycle-top\"><div><div class=\"solar-cycle-title\">Solar Cycle 25 Prediction<\u002Fdiv><div class=\"solar-cycle-source\">NOAA SWPC experimental solar-cycle update · sunspot number and F10.7 cm radio flux<\u002Fdiv><\u002Fdiv><button id=\"reload-solar-cycle\" type=\"button\">이미지 새로고침<\u002Fbutton><\u002Fdiv><div class=\"solar-cycle-image-wrap\"><img id=\"solar-cycle-image\" data-base-src=\"https://services.swpc.noaa.gov/json/solar-cycle/cycle_update.png\" alt=\"NOAA experimental Solar Cycle 25 prediction\" referrerpolicy=\"no-referrer\"><div id=\"solar-cycle-status\" class=\"solar-cycle-status\">태양주기 예측 이미지를 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"solar-cycle-note\">NOAA SWPC가 제공하는 Experimental Solar Cycle 25 Prediction 이미지입니다. 검은색은 월별 관측값, 파란색은 평활 관측값이며, 보라색 영역은 향후 예측 구간을 나타냅니다.<\u002Fdiv><\u002Farticle>\n<\u002Fsection>\n<\u002Fsection>\n<section id=\"wind\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Solar Wind<\u002Fh2><p>NOAA SWPC RTSW <strong>Solar-1<\u002Fstrong> 1분 자료 · GitHub Actions로 누적한 최근 5일과 현재 이후 24시간 빈 구간<\u002Fp><div class=\"data-source-note\">Data source: <strong>NOAA SWPC RTSW Solar-1<\u002Fstrong> · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">Solar-wind plasma 원본 JSON<\u002Fa> · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">IMF 원본 JSON<\u002Fa><\u002Fdiv><\u002Fdiv><span class=\"interactive-hint\">모든 그래프가 동일 시간축 사용 · 각 그래프에 날짜·시간 X축 표시 · 현재선 오른쪽은 24시간 미래 빈 구간<\u002Fspan><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Wind Speed<\u002Fdiv><div class=\"chart-source\">km/s · 자료 범위에 따라 Y축 자동 확장 · 비정상 급락 제거 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-wind-speed\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap compact\"><canvas id=\"c-speed\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Proton Density<\u002Fdiv><div class=\"chart-source\">p/cm³ · Y축 자동 확장 · 열적 proton number density · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-density\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap compact\"><canvas id=\"c-density\"><\u002Fcanvas><\u002Fdiv><div class=\"scale-note\">Proton density는 태양풍 플라즈마의 저에너지·열적 양성자 개수밀도입니다. GOES의 ≥10, ≥50, ≥100, ≥500 MeV energetic proton flux처럼 에너지 임계값별 적분 플럭스로 제공되는 자료가 아닙니다.<\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Total IMF |B| (Bt)<\u002Fdiv><div class=\"chart-source\">NOAA RTSW Solar-1 bt · Y축 자동 확장 · nT · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-bt\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-bt\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF Bx (GSM)<\u002Fdiv><div class=\"chart-source\">자료 진폭에 따라 대칭 Y축 자동 확장 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-bx\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-bx\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF By (GSM)<\u002Fdiv><div class=\"chart-source\">자료 진폭에 따라 대칭 Y축 자동 확장 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-by\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-by\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF Bz (GSM)<\u002Fdiv><div class=\"chart-source\">자료 진폭에 따라 대칭 Y축 자동 확장 · southward Bz는 자기권 결합 강화 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-bz-wind\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-bz\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv>\n<div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">WSA–ENLIL Heliospheric Forecast<\u002Fdiv><div class=\"chart-source\">NOAA SWPC ENLIL spatial-distribution image frames · hourly model animation<\u002Fdiv><\u002Fdiv><div id=\"v-enlil\" class=\"live-value\">FORECAST<\u002Fdiv><\u002Fdiv><div class=\"enlil-controls\"><button id=\"enlil-play\" type=\"button\">▶ 재생<\u002Fbutton><button id=\"enlil-prev\" type=\"button\" aria-label=\"Previous ENLIL frame\">◀<\u002Fbutton><button id=\"enlil-next\" type=\"button\" aria-label=\"Next ENLIL frame\">▶<\u002Fbutton><input id=\"enlil-slider\" type=\"range\" min=\"0\" max=\"0\" value=\"0\" step=\"1\" aria-label=\"ENLIL forecast frame\"><div id=\"enlil-readout\" class=\"enlil-readout\">영상 프레임 목록을 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"enlil-frame-shell\"><img id=\"enlil-image\" alt=\"NOAA WSA-ENLIL heliospheric forecast spatial distribution\"><div id=\"enlil-frame-status\" class=\"enlil-frame-status\">ENLIL 공간 분포 영상을 불러오는 중...<\u002Fdiv><div id=\"enlil-time-badge\" class=\"enlil-time-badge\">-- UTC<\u002Fdiv><\u002Fdiv><div class=\"enlil-note\">NOAA가 제공하는 WSA–ENLIL 공간 분포 JPEG 프레임을 시간 순서대로 재생합니다. 프레임 목록이 갱신되지 않았거나 이미지 서버가 응답하지 않으면 마지막으로 공개된 모델 실행 시각까지만 표시됩니다. 이미지를 클릭하면 확대됩니다.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"geomag\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Geomagnetic Activity<\u002Fh2><p>Planetary Kp, GFZ Hp30, Geospace Dst를 시간축으로 비교<\u002Fp><\u002Fdiv><span class=\"interactive-hint\">공통 커서와 현재 시각 표시<\u002Fspan><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Planetary Kp<\u002Fdiv><div class=\"chart-source\">우측 라벨: NOAA G-scale 기준 G1(Kp 5)–G5(Kp 9) · <a href=\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-kp2\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-kp2\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">GFZ Hp30 Index<\u002Fdiv><div class=\"chart-source\" id=\"hp30-source-status\">30분 해상도 · 최근 7일 · <a id=\"hp30-source-link\" href=\"https://kp.gfz.de/en/hp30-hp60\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">GFZ 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-hp30\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-hp30\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Dst Index<\u002Fdiv><div class=\"chart-source\">nT · <a href=\"https://services.swpc.noaa.gov/json/geospace/geospace_dst_7_day.json\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-dst\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-dst\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"radiation\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Energetic Particle Flux<\u002Fh2><p>GOES integral proton and electron flux · 최근 7일<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Integral Proton Flux<\u002Fdiv><div class=\"chart-source\">GOES primary · NOAA S-scale는 ≥10 MeV 채널 기준 · <a href=\"https://services.swpc.noaa.gov/json/goes/primary/integral-protons-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-proton\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-proton\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Integral Electron Flux<\u002Fdiv><div class=\"chart-source\">GOES secondary · ≥0.8 MeV and ≥2 MeV · electrons/(cm²·s·sr) · <a href=\"https://services.swpc.noaa.gov/json/goes/secondary/integral-electrons-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-electron\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-electron\"><\u002Fcanvas><\u002Fdiv><div class=\"scale-note\">NOAA electron alert 기준은 ≥2 MeV flux 1,000 electrons/(cm²·s·sr)입니다. 강한 proton event 동안 ≥2 MeV electron 채널이 오염될 수 있습니다.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"ionosphere\" class=\"view\">\n  <section class=\"section\">\n    <div class=\"section-head\">\n      <div><h2>Global Ionosphere<\u002Fh2><p>NOAA SWPC GloTEC ultra-real-time global ionospheric specification<\u002Fp><\u002Fdiv>\n      <button id=\"reload-ionosphere\" type=\"button\">전리권 자료 새로고침<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"iono-toolbar\">\n      <div id=\"iono-time\" class=\"iono-time\">최신 GloTEC 자료 탐색 중...<\u002Fdiv>\n      <div id=\"iono-status\" class=\"iono-status\">GeoJSON 파일을 확인하고 있습니다.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"iono-controls\" aria-label=\"Ionosphere map controls\">\n      <div class=\"iono-control\"><span>보간 해상도<\u002Fspan><select id=\"iono-resolution\"><option value=\"1\">1×<\u002Foption><option value=\"2\" selected=\"\">2×<\u002Foption><option value=\"4\">4×<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"iono-control\"><span>Gaussian<\u002Fspan><input id=\"iono-smoothing\" type=\"range\" min=\"0\" max=\"5\" step=\"1\" value=\"2\"><output id=\"iono-smoothing-value\">2<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><span>채움 투명도<\u002Fspan><input id=\"iono-opacity\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"100\"><output id=\"iono-opacity-value\">100%<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><span>Contour<\u002Fspan><select id=\"iono-contours\"><option value=\"0\">없음<\u002Foption><option value=\"6\">6<\u002Foption><option value=\"10\" selected=\"\">10<\u002Foption><option value=\"14\">14<\u002Foption><option value=\"20\">20<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"iono-control\"><span>선 투명도<\u002Fspan><input id=\"iono-contour-alpha\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"50\"><output id=\"iono-contour-alpha-value\">50%<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-labels\" type=\"checkbox\" checked=\"\"> Contour 라벨<\u002Flabel><\u002Fdiv><div class=\"iono-control\"><label><input id=\"iono-show-map\" type=\"checkbox\" checked=\"\"> 대륙 해안선<\u002Flabel><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-grid\" type=\"checkbox\" checked=\"\"> 위·경도 격자<\u002Flabel><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-points\" type=\"checkbox\"> 원본 격자점<\u002Flabel><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"iono-grid\">\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global Total Electron Content<\u002Fdiv><div class=\"chart-source\">Vertical TEC · TECU · <a id=\"iono-source-tec\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-tec-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-tec\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">TEC는 위성–수신기 경로의 전자 수를 수직 방향으로 환산한 총전자량입니다. 1 TECU = 10¹⁶ electrons/m².<\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global NmF2<\u002Fdiv><div class=\"chart-source\">F2-layer peak electron density · <a id=\"iono-source-nmf2\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-nmf2-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-nmf2\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">NmF2는 전리권 F2층 최대 전자밀도입니다. 자료값이 m⁻³ 단위이면 지도에는 10¹² m⁻³ 단위로 환산해 표시합니다.<\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global hmF2<\u002Fdiv><div class=\"chart-source\">F2-layer peak height · km · <a id=\"iono-source-hmf2\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-hmf2-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-hmf2\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">hmF2는 F2층 최대 전자밀도가 나타나는 고도입니다.<\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsection>\n<section id=\"imagery\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Latest Solar Images<\u002Fh2><p>NOAA GOES/SUVI 및 SDO AIA/HMI 최신 영상 · 클릭하면 확대<\u002Fp><\u002Fdiv><button id=\"reload-solar-images\" type=\"button\">이미지 다시 불러오기<\u002Fbutton><\u002Fdiv><div class=\"images\"><article class=\"image-card\" data-label=\"GOES SUVI 171 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/171/latest.png\" alt=\"Latest GOES SUVI 171 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI 171 Å · quiet corona · <a href=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/171/latest.png\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"GOES SUVI 195 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/195/latest.png\" alt=\"Latest GOES SUVI 195 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI 195 Å · corona · <a href=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/195/latest.png\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"GOES SUVI 304 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/304/latest.png\" alt=\"Latest GOES SUVI 304 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI 304 Å · chromosphere · <a href=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/304/latest.png\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO AIA 335 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_0335.jpg\" alt=\"Latest SDO AIA 335 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/AIA 335 Å · active regions · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_0335.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO AIA 1600 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_1600.jpg\" alt=\"Latest SDO AIA 1600 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/AIA 1600 Å · transition region/upper photosphere · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_1600.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO HMI Continuum\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/sdo-hmii/latest.jpg\" alt=\"Latest SDO HMI continuum image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/HMI continuum · photosphere · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIIC.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO HMI Magnetogram\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIB.jpg\" alt=\"Latest SDO HMI magnetogram image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/HMI magnetogram · photospheric magnetic field · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIB.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"GOES SUVI Thematic Map\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/secondary/map/latest.png\" alt=\"Latest GOES SUVI thematic map\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI Thematic Map · <a href=\"https://services.swpc.noaa.gov/images/animations/suvi/secondary/map/latest.png\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"aurora\" class=\"view\"><div class=\"iframe-shell\"><div class=\"iframe-bar\"><div><strong>OVATION Aurora Monitoring<\u002Fstrong><br><span>Geographic probability + MLT–MLAT energy flux<\u002Fspan><\u002Fdiv><button id=\"open-aurora\">새 탭에서 열기 ↗<\u002Fbutton><\u002Fdiv><iframe id=\"aurora-frame\" src=\"about:blank#50a3d5f8-ffef-46a3-b87f-f9a93544c6c5\" title=\"OVATION Aurora Monitoring\"><\u002Fiframe><\u002Fdiv><\u002Fsection>\n<section id=\"report\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>우주환경리포트 제출<\u002Fh2><p>실시간 수집 데이터를 기반으로 리포트를 작성하고 저장·다운로드합니다<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"padding:24px;border:1px solid var(--border);border-radius:16px;background:rgba(9,17,29,.6);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center\"><p style=\"color:var(--muted);max-width:520px;margin:0\">현재 수집된 Kp, Dst, Solar Wind, Bz, X-ray, Proton Flux 및 최근 CME/Flare/지자기폭풍/태양 양성자 이벤트를 자동 요약해 리포트 초안을 생성합니다.<\u002Fp><button type=\"button\" id=\"report-open-btn\" class=\"details-btn\" style=\"font-size:16px;padding:12px 28px\">작성<\u002Fbutton><\u002Fdiv><div id=\"report-tab-list\" style=\"margin-top:16px;display:flex;flex-direction:column;gap:8px\"><\u002Fdiv><\u002Fsection><\u002Fsection>Data sources: NOAA SWPC planetary K-index, Geospace Dst, RTSW solar wind and magnetic field, GOES X-ray, proton, and electron feeds, GloTEC ionosphere GeoJSON; NASA SDO latest imagery; GFZ Kp and Hp30 index.\n<\u002Fmain>\n<div id=\"modal\" class=\"modal\"><div class=\"modal-inner\"><button id=\"modal-close\">닫기<\u002Fbutton><img id=\"modal-img\" alt=\"Expanded solar image\"><\u002Fdiv><\u002Fdiv>\n<div id=\"cactus-modal\" class=\"modal\"><div class=\"modal-inner cactus-modal-inner\"><button id=\"cactus-modal-close\">닫기<\u002Fbutton><div id=\"cactus-modal-body\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div id=\"report-modal\" class=\"modal\"><div class=\"modal-inner cactus-modal-inner report-modal-inner\"><button id=\"report-modal-close\" style=\"position:absolute;top:16px;right:16px;z-index:5\">닫기<\u002Fbutton><div id=\"report-modal-body\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<script async=\"\" src=\"09d402e3-093a-491d-a7cb-f1f35011732b\" onload=\"window.dispatchEvent(new Event('topojsonready'))\"><\u002Fscript>\n<script>\n\"use strict\";\nconst URL={scales:\"https://services.swpc.noaa.gov/products/noaa-scales.json\",kp:\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json\",kpForecast:\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json\",dst:\"https://services.swpc.noaa.gov/json/geospace/geospace_dst_7_day.json\",wind:\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\",mag:\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\",xray:\"https://services.swpc.noaa.gov/json/goes/primary/xrays-7-day.json\",xrayFallback:\"https://services.swpc.noaa.gov/json/goes/primary/xrays-1-day.json\",proton:\"https://services.swpc.noaa.gov/json/goes/primary/integral-protons-7-day.json\",electron:\"https://services.swpc.noaa.gov/json/goes/secondary/integral-electrons-7-day.json\",glotecManifest:\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt.json\",glotecBase:\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\",enlil:\"https://services.swpc.noaa.gov/products/animations/enlil.json\"};\nconst state={data:{},loading:false,enlilIndex:0,enlilPlaying:false,enlilTimer:null};const $=id=>document.getElementById(id);\nfunction donkiRange(days){const end=new Date(),start=new Date(end.getTime()-days*864e5),f=x=>x.toISOString().slice(0,10);return {start:f(start),end:f(end)}}\nfunction buildDonkiUrl(type,days=3){const {start,end}=donkiRange(days);return `https://kauai.ccmc.gsfc.nasa.gov/DONKI/WS/get/${type}?startDate=${start}&endDate=${end}`}\nfunction fetchDonki(type,days=3){\n  const local=`./data/donki/${type.toLowerCase()}.json`;\n  const direct=buildDonkiUrl(type,days),nonce=Date.now();\n  const fallbacks=[`${local}?t=${nonce}`,direct,`https://api.allorigins.win/raw?url=${encodeURIComponent(direct)}&cache=${nonce}`,`https://corsproxy.io/?url=${encodeURIComponent(direct)}&cache=${nonce}`];\n  return safeFetchAny(fallbacks);\n}\nfunction parseCactusText(text){\n  const out=[];let inFlow=false;\n  for(const raw of String(text||'').split('\\n')){\n    const line=raw.trim();if(!line)continue;\n    if(/^#\\s*Flow\\s*\\|/i.test(line)){inFlow=true;continue}\n    if(inFlow||line.startsWith('#')||line.startsWith(':'))continue;\n    const parts=line.split('|').map(s=>s.trim());\n    if(parts.length<9||!/^\\d+$/.test(parts[0]))continue;\n    const [numStr,t0Str,dt0,pa,da,v,dv,minv,maxv,halo]=parts;\n    const t0=Date.parse(t0Str.replace(/\\//g,'-').replace(' ','T')+':00Z');\n    if(!Number.isFinite(t0))continue;\n    out.push({cme:numStr,t0,dt0:Number(dt0),pa:Number(pa),da:Number(da),v:Number(v),dv:Number(dv),minv:Number(minv),maxv:Number(maxv),halo:(halo||'').trim()||null});\n  }\n  return out.sort((a,b)=>b.t0-a.t0);\n}\nasync function fetchCactus(){\n  const nonce=Date.now();\n  try{const r=await fetch(`./data/cactus/cmecat.json?t=${nonce}`,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}\n  const direct='https://www.sidc.be/cactus/out/cmecat.txt';\n  const urls=[direct,`https://api.allorigins.win/raw?url=${encodeURIComponent(direct)}&cache=${nonce}`,`https://corsproxy.io/?url=${encodeURIComponent(direct)}&cache=${nonce}`];\n  let lastError=null;\n  for(const u of urls){\n    try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return parseCactusText(await r.text())}catch(e){lastError=e}\n  }\n  throw lastError||new Error('CACTUS unavailable');\n}\nfunction detectEpisodes(series,threshold,mergeGapMs){\n  const pts=(series||[]).filter(p=>Number.isFinite(p.v)&&p.v>=threshold).sort((a,b)=>a.t-b.t);\n  const episodes=[];\n  for(const p of pts){\n    const last=episodes[episodes.length-1];\n    if(last&&p.t-last.end<=mergeGapMs){last.end=p.t;last.max=Math.max(last.max,p.v)}\n    else episodes.push({start:p.t,end:p.t,max:p.v});\n  }\n  return episodes;\n}\nfunction gScale(kp){return kp>=9?'G5':kp>=8?'G4':kp>=7?'G3':kp>=6?'G2':kp>=5?'G1':null}\nfunction sScale(pfu){return pfu>=1e5?'S5':pfu>=1e4?'S4':pfu>=1e3?'S3':pfu>=100?'S2':pfu>=10?'S1':null}\nfunction buildReportText(){\n  const d=state.data,kpP=latestPoint(d.kp),dstP=latestPoint(d.dst),speedP=latestPoint(d.speed),densityP=latestPoint(d.density),bzP=latestPoint(d.bz),xP=latestPoint(d.xray),protonP=latestPoint(d.proton);\n  const kp=kpP?.v,dst=dstP?.v,speed=speedP?.v,density=densityP?.v,bz=bzP?.v,x=xP?.v,proton=protonP?.v;\n  const s=d.scales||{};\n  const now=new Date().toISOString().slice(0,16).replace('T',' ')+' UTC';\n  const cutoff24=Date.now()-864e5;\n  const stats=(series)=>{const a=(series||[]).filter(p=>p.t>=cutoff24).map(p=>p.v).filter(Number.isFinite);if(!a.length)return null;return{min:Math.min(...a),max:Math.max(...a),avg:a.reduce((s,v)=>s+v,0)/a.length}};\n  const fmtNum=(v,digits)=>Number.isFinite(v)?v.toFixed(digits):'-';\n  const padRow=(cols,widths)=>cols.map((c,i)=>String(c).padEnd(widths[i])).join(' | ');\n  const buildTable=(headers,rows)=>{const widths=headers.map((h,i)=>Math.max(h.length,...rows.map(r=>String(r[i]).length)));const sep=widths.map(w=>'-'.repeat(w)).join('-|-');return[padRow(headers,widths),sep,...rows.map(r=>padRow(r,widths))].join('\\n')};\n  const cactusCutoff=Date.now()-5*864e5;\n  const cme=(d.cme||[]).filter(e=>e.t0>=cactusCutoff).slice().sort((a,b)=>b.t0-a.t0).slice(0,5);\n  const flr=(d.flr||[]).slice().sort((a,b)=>new Date(b.beginTime)-new Date(a.beginTime)).slice(0,5);\n  const gstEp=detectEpisodes((d.kp||[]).filter(p=>p.t>Date.now()-5*864e5),5,6*36e5).sort((a,b)=>b.start-a.start).slice(0,5);\n  const sepEp=detectEpisodes((d.proton||[]).filter(p=>p.t>Date.now()-5*864e5),10,2*36e5).sort((a,b)=>b.start-a.start).slice(0,5);\n  const lines=[];\n  lines.push('우주환경 리포트 (Space Weather Report)');\n  lines.push(`작성 시각: ${now}`);\n  lines.push('');\n  lines.push('[최근 24시간 요약]');\n  const rows24=[\n    ['Kp',stats(d.kp),1,''],\n    ['Dst',stats(d.dst),0,'nT'],\n    ['Solar Wind Speed',stats(d.speed),0,'km/s'],\n    ['Proton Density',stats(d.density),1,'/cm³'],\n    ['IMF Bz',stats(d.bz),1,'nT'],\n    ['Proton Flux (≥10 MeV)',stats(d.proton),1,'pfu']\n  ].map(([name,st,digits,unit])=>[name,st?fmtNum(st.min,digits):'-',st?fmtNum(st.max,digits):'-',st?fmtNum(st.avg,digits):'-',unit||'-']);\n  lines.push(buildTable(['항목','최저','최대','평균','단위'],rows24));\n  lines.push('');\n  lines.push('[현재 지표]');\n  lines.push(`Planetary Kp: ${fmt(kp,1)}`);\n  lines.push(`Dst Index: ${fmt(dst,0)} nT`);\n  lines.push(`Solar Wind Speed: ${fmt(speed,0)} km/s`);\n  lines.push(`Proton Density: ${fmt(density,1)} /cm³`);\n  lines.push(`IMF Bz: ${fmt(bz,1)} nT`);\n  lines.push(`GOES X-ray Flux: ${Number.isFinite(x)?(10**x).toExponential(2):'--'} W/m² (${xrayClass(x)})`);\n  lines.push(`Proton Flux (≥10 MeV): ${fmt(proton,1)} pfu`);\n  lines.push('');\n  lines.push('[NOAA Space Weather Scales]');\n  lines.push(`R (Radio Blackout): R${s.R??0} · S (Solar Radiation Storm): S${s.S??0} · G (Geomagnetic Storm): G${s.G??0}`);\n  lines.push('');\n  lines.push('[CME - CACTUS 자동 검출, 최근 5일]');\n  lines.push(cme.length?cme.map(e=>`- #${e.cme} ${new Date(e.t0).toISOString().slice(0,16).replace('T',' ')} UTC · ${e.v}km/s · PA${e.pa}° · width${e.da}°${e.halo?` · HALO ${e.halo}`:''}`).join('\\n'):'- 없음');\n  lines.push('');\n  lines.push('[Solar Flare - NASA DONKI, 최근 7일]');\n  lines.push(flr.length?flr.map(e=>`- ${e.classType||'?'} · ${e.beginTime?new Date(e.beginTime).toISOString().slice(0,16).replace('T',' '):'--'} UTC · AR${e.activeRegionNum||'-'}`).join('\\n'):'- 없음');\n  lines.push('');\n  lines.push('[Geomagnetic Storm - Kp 실시간 감지, 최근 5일]');\n  lines.push(gstEp.length?gstEp.map(e=>`- ${gScale(e.max)} · Kp ${e.max.toFixed(1)} · 시작 ${new Date(e.start).toISOString().slice(0,16).replace('T',' ')} UTC`).join('\\n'):'- 없음');\n  lines.push('');\n  lines.push('[Solar Proton Events - proton flux 실시간 감지, 최근 5일]');\n  lines.push(sepEp.length?sepEp.map(e=>`- ${sScale(e.max)} · ${e.max.toFixed(0)} pfu · 시작 ${new Date(e.start).toISOString().slice(0,16).replace('T',' ')} UTC`).join('\\n'):'- 없음');\n  return lines.join('\\n');\n}\nfunction reportHistory(){try{return JSON.parse(localStorage.getItem('swx-report-history')||'[]')}catch(e){return[]}}\nfunction saveReportHistory(list){try{localStorage.setItem('swx-report-history',JSON.stringify(list.slice(0,30)))}catch(e){}}\nfunction downloadTextFile(text,filename){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');document.body.appendChild(a);a.href=url;a.download=filename;a.rel='noopener';a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},2000)}\nfunction reportMeta(){try{return JSON.parse(localStorage.getItem('swx-report-meta')||'{}')}catch(e){return{}}}\nfunction saveReportMeta(m){try{localStorage.setItem('swx-report-meta',JSON.stringify(m))}catch(e){}}\nfunction renderReportModal(existing){\n  const box=$('report-modal-body'),text=existing?existing.text:buildReportText(),history=reportHistory(),meta=existing?{author:existing.author,reviewer:existing.reviewer}:reportMeta();\n  box.innerHTML=`<h4 style=\"margin:0 0 10px\">우주환경 리포트<\u002Fh4><div style=\"display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap\"><label style=\"flex:1;min-width:180px;font-size:13px;color:var(--muted)\">보고자<input id=\"report-author\" type=\"text\" value=\"${meta.author||''}\" placeholder=\"이름\" style=\"width:100%;margin-top:4px;background:rgba(255,255,255,.03);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px\"><\u002Flabel><label style=\"flex:1;min-width:180px;font-size:13px;color:var(--muted)\">검토자<input id=\"report-reviewer\" type=\"text\" value=\"${meta.reviewer||''}\" placeholder=\"이름\" style=\"width:100%;margin-top:4px;background:rgba(255,255,255,.03);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px\"><\u002Flabel><\u002Fdiv><textarea id=\"report-textarea\" style=\"width:100%;min-height:50vh;background:rgba(255,255,255,.03);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14.5px;line-height:1.7\">${text}<\u002Ftextarea><div style=\"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap\"><button id=\"report-save-btn\" type=\"button\" class=\"details-btn\">저장 (목록에 추가)<\u002Fbutton><button id=\"report-download-btn\" type=\"button\" class=\"details-btn\">.txt로 다운로드<\u002Fbutton><\u002Fdiv><h5 style=\"margin:18px 0 8px\">저장된 리포트 (${history.length})<\u002Fh5><div id=\"report-history-list\" style=\"display:flex;flex-direction:column;gap:6px\">${history.length?history.map(h=>`<div class=\"event-item\" style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><span>${h.createdAt}<\u002Fspan><span style=\"display:flex;gap:6px\"><button type=\"button\" class=\"details-btn\" data-report-dl=\"${h.id}\" style=\"padding:4px 10px\">다운로드<\u002Fbutton><button type=\"button\" class=\"details-btn\" data-report-del=\"${h.id}\" style=\"padding:4px 10px\">삭제<\u002Fbutton><\u002Fspan><\u002Fdiv>`).join(''):'<div class=\"event-empty\">저장된 리포트 없음<\u002Fdiv>'}<\u002Fdiv>`;\n  $('report-save-btn').onclick=()=>{const t=$('report-textarea').value,list=reportHistory();const id=existing?existing.id:String(Date.now());saveReportMeta({author:$('report-author').value,reviewer:$('report-reviewer').value});const entry={id,createdAt:existing?existing.createdAt:new Date().toISOString().slice(0,16).replace('T',' ')+' UTC',text:t,author:$('report-author').value,reviewer:$('report-reviewer').value};const filtered=list.filter(x=>x.id!==id);filtered.unshift(entry);saveReportHistory(filtered);renderReportModal(entry);renderReportTabList()};\n  $('report-download-btn').onclick=()=>{const t=$('report-textarea').value;downloadTextFile(t,`space-weather-report-${new Date().toISOString().slice(0,10)}.txt`)};\n  box.querySelectorAll('[data-report-dl]').forEach(b=>b.onclick=()=>{const h=reportHistory().find(x=>x.id===b.dataset.reportDl);if(h)downloadTextFile(h.text,`space-weather-report-${h.id}.txt`)});\n  box.querySelectorAll('[data-report-del]').forEach(b=>b.onclick=()=>{saveReportHistory(reportHistory().filter(x=>x.id!==b.dataset.reportDel));renderReportModal(existing&&reportHistory().find(x=>x.id===existing.id));renderReportTabList()});\n}\nfunction renderReportTabList(){\n  const box=$('report-tab-list');if(!box)return;\n  const history=reportHistory();\n  box.innerHTML=history.length?history.map(h=>`<div class=\"event-item\" style=\"cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px\" data-report-open=\"${h.id}\"><span>${h.createdAt} · 보고자: ${h.author||'-'} · 검토자: ${h.reviewer||'-'}<\u002Fspan><button type=\"button\" class=\"details-btn\" data-report-tab-dl=\"${h.id}\" style=\"padding:4px 10px\">다운로드<\u002Fbutton><\u002Fdiv>`).join(''):'<div class=\"event-empty\">저장된 리포트 없음<\u002Fdiv>';\n  box.querySelectorAll('[data-report-open]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-report-tab-dl]'))return;const h=reportHistory().find(x=>x.id===el.dataset.reportOpen);if(h)openReportModal(h)}));\n  box.querySelectorAll('[data-report-tab-dl]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const h=reportHistory().find(x=>x.id===b.dataset.reportTabDl);if(h)downloadTextFile(h.text,`space-weather-report-${h.id}.txt`)}));\n}\nfunction openReportModal(existing){renderReportModal(existing);$('report-modal').classList.add('open')}\nfunction openCactusModal(){\n  const box=$('cactus-modal-body'),d=state.data,cutoff=Date.now()-5*864e5;\n  const cme=(d.cme||[]).filter(e=>e.t0>=cutoff).slice().sort((a,b)=>b.t0-a.t0);\n  const rows=cme.length?cme.map(e=>`<tr><td>${e.cme}<\u002Ftd><td>${new Date(e.t0).toISOString().slice(0,16).replace('T',' ')}<\u002Ftd><td>${e.dt0}<\u002Ftd><td>${e.pa}<\u002Ftd><td>${e.da}<\u002Ftd><td>${e.v}<\u002Ftd><td>${e.dv}<\u002Ftd><td>${e.minv}<\u002Ftd><td>${e.maxv}<\u002Ftd><td>${e.halo||'-'}<\u002Ftd><\u002Ftr>`).join(''):'<tr><td colspan=\"10\">최근 3일 내 CACTUS CME 검출 없음<\u002Ftd><\u002Ftr>';\n  box.innerHTML=`<h4 style=\"margin:0 0 10px\">CACTUS CME 목록 (최근 5일)<\u002Fh4><div class=\"cactus-glossary\"><div><b>#<\u002Fb><span>CME 번호<\u002Fspan><\u002Fdiv><div><b>t0<\u002Fb><span>최초 감지 시각(발생 시작)<\u002Fspan><\u002Fdiv><div><b>dt0<\u002Fb><span>발생 지속시간(시간)<\u002Fspan><\u002Fdiv><div><b>PA<\u002Fb><span>주 진행각(북쪽 기준 반시계, °)<\u002Fspan><\u002Fdiv><div><b>da<\u002Fb><span>각폭(°, 클수록 넓게 퍼짐)<\u002Fspan><\u002Fdiv><div><b>v<\u002Fb><span>중앙 속도(km/s)<\u002Fspan><\u002Fdiv><div><b>dv<\u002Fb><span>속도 편차(1σ)<\u002Fspan><\u002Fdiv><div><b>minv/maxv<\u002Fb><span>최소/최대 속도<\u002Fspan><\u002Fdiv><div><b>halo<\u002Fb><span>da&gt;90°(II)/180°(III)/270°(IV)면 지구지향 가능성 있는 halo/partial halo CME<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"overflow-x:auto\"><table class=\"cactus-table\"><thead><tr><th>#<\u002Fth><th>t0 (UTC)<\u002Fth><th>dt0(h)<\u002Fth><th>PA(°)<\u002Fth><th>da(°)<\u002Fth><th>v(km/s)<\u002Fth><th>dv<\u002Fth><th>minv<\u002Fth><th>maxv<\u002Fth><th>halo<\u002Fth><\u002Ftr><\u002Fthead><tbody>${rows}<\u002Ftbody><\u002Ftable><\u002Fdiv><div class=\"data-source-note\" style=\"margin-top:10px\">SIDC CACTUS 자동 CME 검출 카탈로그(LASCO C2/C3). 자동 알고리즘 결과라 노이즈성 오검출이 섞일 수 있습니다.<br><a href=\"https://www.sidc.be/cactus/out/cmecat.txt\" target=\"_blank\" rel=\"noopener\">cmecat.txt ↗<\u002Fa> · <a href=\"https://www.sidc.be/cactus/\" target=\"_blank\" rel=\"noopener\">CACTUS ↗<\u002Fa><\u002Fdiv>`;\n  $('cactus-modal').classList.add('open');\n}\nfunction renderDonki(d){\n  const failed=new Set(d.failedSources||[]);\n  const failNote='<div class=\"event-empty\">데이터를 불러오지 못했습니다 · 다음 새로고침에 재시도<\u002Fdiv>';\n  const cmeList=$('cme-list'),flrList=$('flr-list');if(!cmeList||!flrList)return;\n  const cactusCutoff=Date.now()-5*864e5;\n  const cme=(d.cme||[]).filter(e=>e.t0>=cactusCutoff).slice().sort((a,b)=>b.t0-a.t0);\n  const flr=(d.flr||[]).slice().sort((a,b)=>new Date(b.beginTime)-new Date(a.beginTime)).slice(0,6);\n  cmeList.innerHTML=failed.has('cme')&&!cme.length?failNote:cme.length?cme.map(e=>{\n    const t=new Date(e.t0).toISOString().slice(0,16).replace('T',' ')+' UTC';\n    const haloBadge=e.halo?` · <span style=\"color:#ff9d50;font-weight:700\">HALO ${e.halo}<\u002Fspan>`:'';\n    return `<div class=\"event-item\">CME #${e.cme} · ${e.v} km/s · ${t} · PA ${e.pa}° · width ${e.da}°${haloBadge}<\u002Fdiv>`;\n  }).join(''):'<div class=\"event-empty\">최근 5일 내 CACTUS CME 검출 없음<\u002Fdiv>';\n  if(cmeList&&!cmeList.dataset.zoomBound){cmeList.dataset.zoomBound='1';cmeList.style.cursor='pointer';cmeList.addEventListener('click',()=>openCactusModal())}\n  flrList.innerHTML=failed.has('flr')&&!flr.length?failNote:flr.length?flr.map(e=>{\n    const t=e.beginTime?new Date requestAnimationFrame(()=>drawSolarDisk())};\n  img.onerror=()=>{st.textContent='HMI 영상 로딩 실패';drawSolarDisk()};\n  img.src='https://sdo.gsfc.nasa.gov/assets/img/latest/latest_512_HMIIC.jpg?t='+Date.now();\n}\n\nfunction solarEphemeris(date=new Date()){\n  const jd=date.getTime()/86400000+2440587.5, n=jd-2451545.0, rad=Math.PI/180;\n  const L=(280.460+0.9856474*n)%360;\n  const g=(357.528+0.9856003*n)%360;\n  const lambda=(L+1.915*Math.sin(g*rad)+0.020*Math.sin(2*g*rad))*rad;\n  const eps=(23.439-0.0000004*n)*rad;\n  const alpha=Math.atan2(Math.cos(eps)*Math.sin(lambda),Math.cos(lambda));\n  const delta=Math.asin(Math.sin(eps)*Math.sin(lambda));\n  const ap=286.13*rad, dp=63.87*rad;\n  const B0=-Math.asin(Math.sin(delta)*Math.sin(dp)+Math.cos(delta)*Math.cos(dp)*Math.cos(alpha-ap));\n  const P=Math.atan2(Math.cos(dp)*Math.sin(ap-alpha),Math.sin(dp)*Math.cos(delta)-Math.cos(dp)*Math.sin(delta)*Math.cos(ap-alpha));\n  return {B0,P};\n}\nfunction projectHeliographic(latDeg,westDeg,date=new Date()){\n  const rad=Math.PI/180, lat=latDeg*rad, L=westDeg*rad, {B0}=solarEphemeris(date);\n  // Stonyhurst heliographic coordinates projected onto a solar-north-up HMI image.\n  // The NASA latest HMI JPEG is already oriented with solar north upward, so P-angle\n  // must NOT be applied again. Applying it twice mixes longitude into screen latitude.\n  const x=Math.cos(lat)*Math.sin(L);\n  const y=Math.sin(lat)*Math.cos(B0)-Math.cos(lat)*Math.cos(L)*Math.sin(B0);\n  const z=Math.sin(lat)*Math.sin(B0)+Math.cos(lat)*Math.cos(L)*Math.cos(B0);\n  if(z<0)return null;\n  return {x,y,z};\n}\nfunction drawSolarDisk(){\n  const cvs=document.getElementById('solar-disk');\n  const layer=document.getElementById('solar-region-label-layer');\n  if(!cvs)return 0;\n  const ctx=cvs.getContext('2d');\n  ctx.clearRect(0,0,cvs.width,cvs.height);\n  cvs._markers=[];\n  if(layer) layer.innerHTML='';\n  let shown=0;\n  solarRegionsData.forEach(r=>{\n    const pos=parseRegionLoc(r);if(!pos)return;\n    const obsMs=Date.parse(/Z$|[+-]\\d\\d:?\\d\\d$/.test(r.observed||'')?r.observed:(r.observed||'')+'Z');\n    let lon=pos.lon;\n    if(Number.isFinite(obsMs)){\n      const deltaDays=(Date.now()-obsMs)/864e5;\n      lon=pos.lon+13.2*deltaDays;\n    }\n    const q=projectHeliographic(pos.lat,lon,new Date());if(!q)return;\n    const xp=50-q.x*46.8, yp=50-q.y*46.8;\n    if(xp<1||xp>99||yp<1||yp>99)return;\n    const px=xp/100*cvs.width, py=yp/100*cvs.height;\n    const selected=selectedRegion&&String(selectedRegion.ar)===String(r.ar);\n\n    // Reliable canvas fallback: always draw the AR number directly above the HMI image.\n    ctx.save();\n    ctx.font='900 21px Inter, Arial, sans-serif';\n    ctx.textAlign='center';\n    ctx.textBaseline='middle';\n    ctx.lineJoin='round';\n    ctx.lineWidth=5;\n    ctx.strokeStyle='rgba(0,0,0,.96)';\n    ctx.strokeText(`AR ${r.ar}`,px,py-30);\n    ctx.fillStyle=selected?'#7ee7b7':'#ffffff';\n    ctx.fillText(`AR ${r.ar}`,px,py-30);\n    if(selected){\n      const r2=Math.hypot(q.x,q.y);\n      const radialAngle=r2>0.001?Math.atan2(-q.y,-q.x):0;\n      const baseR=38;\n      ctx.save();\n      ctx.translate(px,py);\n      ctx.rotate(radialAngle);\n      ctx.beginPath();\n      ctx.setLineDash([9,7]);\n      ctx.lineWidth=3;\n      ctx.strokeStyle='rgba(255,255,255,.95)';\n      ctx.ellipse(0,0,baseR*Math.max(q.z,.15),baseR,0,0,Math.PI*2);\n      ctx.stroke();\n      ctx.setLineDash([]);\n      ctx.restore();\n    }\n    ctx.restore();\n\n    cvs._markers.push({x:px,y:py,r:58*cvs.width/1200,data:r});\n    shown++;\n  });\n  const st=document.getElementById('solar-disk-image-status');\n  if(st) st.textContent=`NASA SDO/HMI latest · AR labels ${shown}`;\n  return shown;\n}\nfunction renderRegionCards(){\n  const panel=document.getElementById('solar-regions-panel');\n  panel.innerHTML=solarRegionsData.map(r=>{const sev=severityFromMag(r.mag,r.m,r.x);return `<div class=\"region-card\" data-ar=\"${r.ar}\"><div class=\"region-head\"><div><div class=\"region-ar\">AR ${r.ar}<\u002Fdiv><div class=\"region-loc\">${r.loc}<\u002Fdiv><\u002Fdiv><div class=\"region-badge\" style=\"${sev[1]}\">${sev[0]}<\u002Fdiv><\u002Fdiv><div class=\"region-meta\"><div class=\"meta-box\"><div class=\"meta-k\">Magnetic<\u002Fdiv><div class=\"meta-v\">${r.mag}<\u002Fdiv><\u002Fdiv><div class=\"meta-box\"><div class=\"meta-k\">McIntosh<\u002Fdiv><div class=\"meta-v\">${r.mc}<\u002Fdiv><div class=\"mc-level\">${mcIntoshComplexity(r.mc).level}<\u002Fdiv><\u002Fdiv><div class=\"meta-box\"><div class=\"meta-k\">Area<\u002Fdiv><div class=\"meta-v\">${r.area}<\u002Fdiv><\u002Fdiv><div class=\"meta-box\"><div class=\"meta-k\">Spots<\u002Fdiv><div class=\"meta-v\">${r.spots}<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"region-bars\">${[['C',r.c,'#44d17a'],['M',r.m,'#ffb84d'],['X',r.x,'#ff5c7a']].map(v=>`<div class=\"forecast-row\"><div class=\"forecast-label\">${v[0]}<\u002Fdiv><div class=\"prob-bar\"><div class=\"prob-fill\" style=\"width:${Math.max(0,Math.min(100,v[1]))}%;background:${v[2]}\"><\u002Fdiv><\u002Fdiv><div class=\"prob-val\">${v[1]}%<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv><\u002Fdiv>`}).join('');\n  panel.querySelectorAll('.region-card').forEach(el=>{el.classList.toggle('active',selectedRegion&&String(el.dataset.ar)===String(selectedRegion.ar));el.style.cursor='pointer';el.onclick=()=>{const r=solarRegionsData.find(x=>String(x.ar)===el.dataset.ar);if(r)showRegionDetail(r)}});\n}\nfunction getSunspotSeries(ar){\n  const key=String(ar),byDay={};\n  const addRow=(raw,source)=>{\n    const rawAr=firstValue(raw,['region','region_number','ar','active_region','noaa_region','noaa_ar','region_id'],'');\n    if(String(rawAr)!==key)return;\n    const row=normalizeRegion(raw), ds=(row.observed||obsTime(raw)).slice(0,10);\n    if(!ds)return;\n    const candidate={date:ds,area:row.area,spots:row.spots,loc:row.loc,mc:row.mc,mag:row.mag,m:row.m,x:row.x,source};\n    const old=byDay[ds];\n    if(!old || candidate.area>old.area || (candidate.area===old.area&&candidate.spots>old.spots))byDay[ds]=candidate;\n  };\n  // solar_regions.json itself contains multiple dated records and provides the most\n  // reliable AR-number linkage. Use it as the primary history source.\n  for(const raw of solarRegionHistoryData||[])addRow(raw,'solar_regions');\n  // Add matching observatory reports when sunspot_report exposes a NOAA region number.\n  for(const raw of sunspotReportData||[])addRow(raw,'sunspot_report');\n  return Object.values(byDay).sort((a,b)=>a.date.localeCompare(b.date)).slice(-14);\n}\nfunction drawSpark(canvasId,series,key,color,label){\n  const c=document.getElementById(canvasId);if(!c)return;\n  const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;\n  const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);\n  const ml=40,mr=34;\n  ctx.strokeStyle='rgba(255,255,255,.1)';for(let i=0;i<4;i++){const yy=12+i*(h-28)/3;ctx.beginPath();ctx.moveTo(ml,yy);ctx.lineTo(w-mr,yy);ctx.stroke()}\n  if(!series.length){ctx.fillStyle='#9fb5d1';ctx.font='14px system-ui';ctx.fillText('No recent region history is available for this AR.',12,h/2);c._spec=null;return}\n  const vals=series.map(dd=>Number(dd[key]||0)),min=Math.min(...vals),max=Math.max(...vals,min+1);\n  const x=i=>ml+(w-ml-mr)*(series.length===1?.5:i/(series.length-1)),y=v=>h-22-(h-42)*((v-min)/(max-min||1));\n  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();series.forEach((dd,i)=>i?ctx.lineTo(x(i),y(dd[key])):ctx.moveTo(x(i),y(dd[key])));ctx.stroke();\n  ctx.fillStyle=color;series.forEach((dd,i)=>{ctx.beginPath();ctx.arc(x(i),y(dd[key]),3.5,0,Math.PI*2);ctx.fill()});\n  ctx.fillStyle='#8ea6c6';ctx.font='11px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';\n  ctx.fillText(String(max),ml-6,12);ctx.fillText(String(min),ml-6,h-22);\n  ctx.textAlign='center';series.forEach((dd,i)=>{ctx.fillStyle='#8ea6c6';ctx.fillText(dd.date.slice(5),x(i),h-5)});\n  c._spec={series,key,x,y,color,label,min,max,w,h};\n  if(!c.dataset.sparkBound){\n    c.dataset.sparkBound='1';\n    c.addEventListener('pointermove',e=>{\n      const spec=c._spec;if(!spec)return;\n      const r=c.getBoundingClientRect(),px=(e.clientX-r.left);\n      let nearest=0,best=Infinity;\n      spec.series.forEach((dd,i)=>{const dist=Math.abs(spec.x(i)-px);if(dist<best){best=dist;nearest=i}});\n      const dd=spec.series[nearest],vx=spec.x(nearest),vy=spec.y(dd[spec.key]);\n      const ctx2=c.getContext('2d');\n      drawSpark(canvasId,spec.series,spec.key,spec.color,spec.label);\n      ctx2.save();ctx2.strokeStyle='rgba(255,255,255,.35)';ctx2.setLineDash([3,3]);ctx2.beginPath();ctx2.moveTo(vx,12);ctx2.lineTo(vx,spec.h-22);ctx2.stroke();ctx2.setLineDash([]);\n      ctx2.fillStyle=spec.color;ctx2.beginPath();ctx2.arc(vx,vy,5,0,Math.PI*2);ctx2.fill();ctx2.strokeStyle='#04101b';ctx2.lineWidth=1.5;ctx2.stroke();\n      const text=`${dd.date}: ${dd[spec.key]}`;ctx2.font='12px system-ui';const tw=ctx2.measureText(text).width+16;\n      const bx=Math.min(Math.max(vx-tw/2,2),spec.w-tw-2),by=Math.max(vy-30,2);\n      ctx2.fillStyle='rgba(5,11,20,.95)';ctx2.strokeStyle='rgba(255,255,255,.25)';ctx2.beginPath();ctx2.roundRect(bx,by,tw,20,5);ctx2.fill();ctx2.stroke();\n      ctx2.fillStyle='#eef6ff';ctx2.textAlign='left';ctx2.textBaseline='middle';ctx2.fillText(text,bx+8,by+10);\n      ctx2.restore();\n    });\n    c.addEventListener('pointerleave',()=>drawSpark(canvasId,c._spec.series,c._spec.key,c._spec.color,c._spec.label));\n  }\n}\nfunction showRegionDetail(r){selectedRegion=r;renderRegionCards();requestAnimationFrame(()=>drawSolarDisk());const box=document.getElementById('region-detail-panel'),series=getSunspotSeries(r.ar);const flrs=(state.data.flr||[]).filter(f=>String(f.activeRegionNum)===String(r.ar)).sort((a,b)=>new Date(b.beginTime)-new Date(a.beginTime));const flareHistoryHtml=flrs.length?`<div class=\"sunspot-mini-table\" style=\"margin-top:10px\"><div class=\"sunspot-mini-row sunspot-mini-head\"><div>Class<\u002Fdiv><div>Begin (UTC)<\u002Fdiv><div>Peak (UTC)<\u002Fdiv><div>End (UTC)<\u002Fdiv><\u002Fdiv>${flrs.map(f=>`<div class=\"sunspot-mini-row\"><div>${f.classType||'?'}<\u002Fdiv><div>${f.beginTime?f.beginTime.slice(0,16).replace('T',' '):'-'}<\u002Fdiv><div>${f.peakTime?f.peakTime.slice(0,16).replace('T',' '):'-'}<\u002Fdiv><div>${f.endTime?f.endTime.slice(0,16).replace('T',' '):'-'}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>`:'<div class=\"muted\" style=\"margin-top:10px\">최근 7일 내 이 활동영역의 플레어 기록 없음<\u002Fdiv>';box.innerHTML=`<h4>AR ${r.ar}<\u002Fh4><div class=\"muted\">${r.loc} · Magnetic ${r.mag} · McIntosh ${r.mc} (${mcIntoshComplexity(r.mc).level})<\u002Fdiv><div class=\"mc-explain\"><strong>McIntosh 복잡도:<\u002Fstrong> ${mcIntoshComplexity(r.mc).detail}<\u002Fdiv><div class=\"region-stats\"><div class=\"trend-box\"><div class=\"k\">Current Area<\u002Fdiv><div class=\"v\">${r.area}<\u002Fdiv><\u002Fdiv><div class=\"trend-box\"><div class=\"k\">Current Spots<\u002Fdiv><div class=\"v\">${r.spots}<\u002Fdiv><\u002Fdiv><div class=\"trend-box\"><div class=\"k\">M Probability<\u002Fdiv><div class=\"v\">${r.m}%<\u002Fdiv><\u002Fdiv><div class=\"trend-box\"><div class=\"k\">X Probability<\u002Fdiv><div class=\"v\">${r.x}%<\u002Fdiv><\u002Fdiv><\u002Fdiv><h5 style=\"margin:12px 0 4px\">Flare History (NASA DONKI, 7일)<\u002Fh5>${flareHistoryHtml}<div class=\"spark-wrap\"><h5>Area Trend<\u002Fh5><canvas id=\"spark-area\" class=\"spark\"><\u002Fcanvas><\u002Fdiv><div class=\"spark-wrap\"><h5>Spot Count Trend<\u002Fh5><canvas id=\"spark-spots\" class=\"spark\"><\u002Fcanvas><\u002Fdiv><div class=\"sunspot-mini-table\" style=\"margin-top:10px\"><div class=\"sunspot-mini-row sunspot-mini-head\" style=\"grid-template-columns:88px 92px 64px 60px 70px 70px 50px 50px\"><div>Date<\u002Fdiv><div>Location<\u002Fdiv><div>Area<\u002Fdiv><div>Spots<\u002Fdiv><div>Magnetic<\u002Fdiv><div>McIntosh<\u002Fdiv><div>M%<\u002Fdiv><div>X%<\u002Fdiv><\u002Fdiv>${series.map(s=>`<div class=\"sunspot-mini-row\" style=\"grid-template-columns:88px 92px 64px 60px 70px 70px 50px 50px\"><div>${s.date}<\u002Fdiv><div>${s.loc}<\u002Fdiv><div>${s.area}<\u002Fdiv><div>${s.spots}<\u002Fdiv><div>${s.mag||'-'}<\u002Fdiv><div>${s.mc||'-'}<\u002Fdiv><div>${Number.isFinite(s.m)?s.m:'-'}<\u002Fdiv><div>${Number.isFinite(s.x)?s.x:'-'}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv><div class=\"data-source-note\">Area and spot-count history uses NOAA SWPC daily composite region observations. These are combined reports from multiple observatories and may not represent a single instantaneous measurement.<br><a href=\"https://services.swpc.noaa.gov/json/solar_regions.json\" target=\"_blank\" rel=\"noopener\">solar_regions.json ↗<\u002Fa> · <a href=\"https://services.swpc.noaa.gov/json/sunspot_report.json\" target=\"_blank\" rel=\"noopener\">sunspot_report.json ↗<\u002Fa> · <a href=\"https://www.spaceweather.gov/products/summary-space-weather-observations\" target=\"_blank\" rel=\"noopener\">NOAA product description ↗<\u002Fa><\u002Fdiv>`;requestAnimationFrame(()=>{drawSpark('spark-area',series,'area','#ffb84d','Area');drawSpark('spark-spots',series,'spots','#59d0ff','Spots')})}\nasync function loadSunspotReport(){try{const r=await fetch('https://services.swpc.noaa.gov/json/sunspot_report.json?t='+Date.now(),{cache:'no-store'});sunspotReportData=await r.json()}catch(e){console.warn('sunspot_report failed',e);sunspotReportData=[]}}\nasync function loadSolarRegions(){\n  const status=document.getElementById('solar-regions-status');\n  try{\n    status.textContent='Updating...';const res=await fetch('https://services.swpc.noaa.gov/json/solar_regions.json?t='+Date.now(),{cache:'no-store'}),data=await res.json();\n    const rawRows=Array.isArray(data)?data:[];const norm=rawRows.map(normalizeRegion).filter(r=>r.ar!=='-');solarRegionHistoryData=rawRows;\n    const latestDate=norm.map(r=>r.observed.slice(0,10)).filter(Boolean).sort().pop()||'';\n    const candidates=latestDate?norm.filter(r=>r.observed.startsWith(latestDate)):norm;\n    const byAr=new Map();for(const r of candidates){const old=byAr.get(String(r.ar));if(!old||r.observed>old.observed)byAr.set(String(r.ar),r)}\n    solarRegionsData=[...byAr.values()].sort((a,b)=>(b.x*100+b.m*10+b.area)-(a.x*100+a.m*10+a.area));\n    renderRegionCards();drawSolarDisk();status.textContent=`Updated · ${solarRegionsData.length} active regions · ${latestDate||'latest'}`;\n    if(solarRegionsData.length){const keep=solarRegionsData.find(r=>selectedRegion&&String(r.ar)===String(selectedRegion.ar));showRegionDetail(keep||solarRegionsData[0])}\n  }catch(e){status.textContent='Failed to load active regions';console.error(e)}\n}\nconst disk=document.getElementById('solar-disk');if(disk){disk.addEventListener('mousemove',ev=>{const r=disk.getBoundingClientRect(),x=(ev.clientX-r.left)*(disk.width/r.width),y=(ev.clientY-r.top)*(disk.height/r.height);disk.style.cursor=(disk._markers||[]).some(m=>Math.hypot(m.x-x,m.y-y)<=m.r)?'pointer':'zoom-in'});disk.addEventListener('click',ev=>{const r=disk.getBoundingClientRect(),x=(ev.clientX-r.left)*(disk.width/r.width),y=(ev.clientY-r.top)*(disk.height/r.height),hit=(disk._markers||[]).find(m=>Math.hypot(m.x-x,m.y-y)<=m.r);if(hit){showRegionDetail(hit.data);return}const img=document.getElementById('solar-disk-image');if(img&&img.src){document.getElementById('modal-img').src=img.src;document.getElementById('modal-img').alt='Latest NASA SDO HMI continuum solar disk';document.getElementById('modal').classList.add('open')}})}\nloadSolarProbabilities();\nPromise.allSettled([loadSunspotReport(),loadSolarRegions()]).then(()=>loadSolarRegions());\nloadSolarDiskImage();\nsetInterval(loadSolarProbabilities,30*60*1000);setInterval(()=>{loadSunspotReport().then(loadSolarRegions)},60*60*1000);setInterval(loadSolarDiskImage,10*60*1000);\n\nwindow.addEventListener('resize',()=>requestAnimationFrame(()=>drawSolarDisk()));\nsetTimeout(()=>drawSolarDisk(),
