  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(135deg,rgba(76,183,229,.26),rgba(77,231,179,.12));color:var(--text);box-shadow:inset 0 0 0 1px rgba(109,214,255,.38)}.view{display:none}.view.active{display:block}.hero-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{padding:13px 14px;border:1px solid var(--border);border-radius:13px;background:linear-gradient(180deg,rgba(18,30,48,.9),rgba(10,18,31,.9));min-height:98px}.metric-label{color:var(--muted);font-size:16px;margin-bottom:8px}.metric-value{font-size:clamp(23px,2.4vw,34px);font-weight:700;letter-spacing:-.03em}.metric-unit{font-size:16px;color:var(--muted);margin-left:5px}.metric-foot{margin-top:7px;color:var(--muted);font-size:15px}.section{border:1px solid var(--border);border-radius:17px;background:linear-gradient(180deg,rgba(13,22,37,.94),rgba(6,12,23,.96));padding:14px;margin-bottom:14px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:11px}.section-head h2{margin:0;font-size:26px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:16px}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.chart-card{border:1px solid var(--border);border-radius:14px;background:rgba(9,17,29,.76);padding:12px;min-width:0}.chart-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title{font-size:20px;font-weight:600}.chart-source{color:var(--muted);font-size:14px;margin-top:4px}.live-value{font-size:18px;font-weight:700;text-align:right;line-height:1.35;max-width:48%;word-break:keep-all}.canvas-wrap{position:relative;width:100%;height:290px}.canvas-wrap.tall{height:370px}canvas{width:100%;height:100%;display:block}.scale-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.scale-card{padding:15px;border:1px solid var(--border);border-radius:14px;background:rgba(10,19,33,.82)}.scale-badge{displ label\">Planetary Kp<\u002Fdiv><div><span id=\"m-kp\" class=\"metric-value\">--<\u002Fspan><\u002Fdiv><div id=\"m-kp-foot\" class=\"metric-foot\">NOAA planetary K-index<\u002Fdiv><\u002Farticle>\n    <article class=\"metric\"><div class=\"metric-label\">Dst Index<\u002Fdiv><div><span id=\"m-dst\" class=\"metric-value\">--<\u002Fspan><span class=\"metric-unit\">nT<\u002Fspan><\u002Fdiv><div class=\"metric-foot\">Geospace model<\u002Fdiv><\u002Farticle>\n    <article class=\"metric\"><div class=\"metric-label\">Wind Speed<\u002Fdiv><div><span id=\"m-speed\" class=\"metric-value\">--<\u002Fspan><span class=\"metric-unit\">km/s<\u002Fspan><\u002Fdiv><div class=\"metric-foot\">Active RTSW spacecraft<\u002Fdiv><\u002Farticle>\n    <article class=\"metric\"><div class=\"metric-label\">IMF Bz GSM<\u002Fdiv><div><span id=\"m-bz\" class=\"metric-value\">--<\u002Fspan><span class=\"metric-unit\">nT<\u002Fspan><\u002Fdiv><div id=\"m-bz-foot\" class=\"metric-foot\">Southward Bz enhances coupling<\u002Fdiv><\u002Farticle>\n  <\u002Fdiv>\n  <section class=\"section\"><div class=\"section-head\"><div><h2>NOAA Space Weather Scales<\u002Fh2><p>현재 R, S, G 단계 요약<\u002Fp><\u002Fdiv><span id=\"scale-time\" class=\"chart-source\">--<\u002Fspan><\u002Fdiv><div class=\"scale-row\" id=\"scale-row\"><\u002Fdiv><\u002Fsection>\n  <section class=\"section\"><div class=\"section-head\"><div><h2>Current Conditions<\u002Fh2><p>핵심 지표를 한 화면에서 비교<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"grid-2\" style=\"grid-auto-flow:column;grid-template-rows:repeat(2,auto)\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Planetary Kp<\u002Fdiv><div class=\"chart-source\">NOAA planetary K-index<\u002Fdiv><\u002Fdiv><div id=\"v-kp\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-kp\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"geomag\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Dst Index<\u002Fdiv><div class=\"chart-source\">NOAA Real-time Geospace model Dst<\u002Fdiv><\u002Fdiv><div id=\"v-dst-overview\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-overview-dst\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"geomag\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Solar Wind<\u002Fdiv><div class=\"chart-source\">NOAA RTSW 1-minute data<\u002Fdiv><\u002Fdiv><div id=\"v-speed\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-overview-wind\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"wind\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF Bz<\u002Fdiv><div class=\"chart-source\">NOAA RTSW 1-minute data<\u002Fdiv><\u002Fdiv><div id=\"v-bz-overview\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-overview-bz\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"wind\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<\u002Fsection>\n\n<section id=\"solar\" class=\"view\">\n<section class=\"section\">\n  <div class=\"section-head\"><div><h2>Solar X-ray Activity<\u002Fh2><p>GOES 0.1–0.8 nm soft X-ray flux · logarithmic scale · <a href=\"https://services.swpc.noaa.gov/json/goes/primary/xrays-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fp><\u002Fdiv><div id=\"v-xray\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n  <div class=\"chart-card\"><div class=\"canvas-wrap tall\"><canvas id=\"c-xray\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section class=\"section\">\n  <div class=\"section-head\"><div><h2>3-Day Flare &amp; Proton Forecast<\u002Fh2><p>NOAA SWPC 전 태양면 C/M/X급 플레어 및 ≥10 MeV proton event 확률<\u002Fp><\u002Fdiv><span id=\"solar-probabilities-status\" class=\"chart-source\">불러오는 중...<\u002Fspan><\u002Fdiv>\n  <div id=\"solar-probabilities-panel\" class=\"forecast-grid\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"section\">\n  <div class=\"section-head\"><div><h2>Active Solar Regions<\u002Fh2><p>현재 NOAA 활동영역의 위치, 복잡도 및 플레어 잠재력<\u002Fp><\u002Fdiv><span id=\"solar-regions-status\" class=\"chart-source\">불러오는 중...<\u002Fspan><\u002Fdiv>\n  <div id=\"solar-regions-panel\" class=\"regions-grid\"><\u002Fdiv>\n            <div class=\"solar-disk-wrap\">\n              <div class=\"solar-disk-panel\">\n                <h4 style=\"margin:0 0 8px;font-size:20px\">Active Regions on Solar Disk<\u002Fh4>\n                <div class=\"solar-image-stage\">\n                  <img id=\"solar-disk-image\" alt=\"Latest NASA SDO HMI continuum solar image\" referrerpolicy=\"no-referrer\">\n                  <canvas id=\"solar-disk\" width=\"1200\" height=\"1200\"><\u002Fcanvas><div id=\"solar-region-label-layer\" aria-label=\"Active region labels\"><\u002Fdiv><svg id=\"solar-region-overlay\" viewBox=\"0 0 1000 1000\" preserveAspectRatio=\"none\" aria-label=\"Active region labels\"><\u002Fsvg>\n                  <div id=\"solar-disk-image-status\" class=\"disk-image-status\">최신 HMI 영상 불러오는 중...<\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"disk-help\">NOAA Stonyhurst coordinates projected onto the solar-north-up HMI disk using the current solar B0. Click an empty area to enlarge the image.<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"region-detail\" id=\"region-detail-panel\">\n                <h4>Select an active region<\u002Fh4>\n                <div class=\"muted\">Click a marker on the solar disk or a region card below to view recent sunspot report trends.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n<\u002Fsection>\n<section class=\"section\">\n  <article class=\"solar-cycle-card\"><div class=\"solar-cycle-top\"><div><div class=\"solar-cycle-title\">Solar Cycle 25 Prediction<\u002Fdiv><div class=\"solar-cycle-source\">NOAA SWPC experimental solar-cycle update · sunspot number and F10.7 cm radio flux<\u002Fdiv><\u002Fdiv><button id=\"reload-solar-cycle\" type=\"button\">이미지 새로고침<\u002Fbutton><\u002Fdiv><div class=\"solar-cycle-image-wrap\"><img id=\"solar-cycle-image\" data-base-src=\"https://services.swpc.noaa.gov/json/solar-cycle/cycle_update.png\" alt=\"NOAA experimental Solar Cycle 25 prediction\" referrerpolicy=\"no-referrer\"><div id=\"solar-cycle-status\" class=\"solar-cycle-status\">태양주기 예측 이미지를 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"solar-cycle-note\">NOAA SWPC가 제공하는 Experimental Solar Cycle 25 Prediction 이미지입니다. 검은색은 월별 관측값, 파란색은 평활 관측값이며, 보라색 영역은 향후 예측 구간을 나타냅니다.<\u002Fdiv><\u002Farticle>\n<\u002Fsection>\n<\u002Fsection>\n<section id=\"wind\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Solar Wind<\u002Fh2><p>NOAA SWPC RTSW <strong>Solar-1<\u002Fstrong> 1분 자료 · GitHub Actions로 누적한 최근 5일과 현재 이후 24시간 빈 구간<\u002Fp><div class=\"data-source-note\">Data source: <strong>NOAA SWPC RTSW Solar-1<\u002Fstrong> · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">Solar-wind plasma 원본 JSON<\u002Fa> · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">IMF 원본 JSON<\u002Fa><\u002Fdiv><\u002Fdiv><span class=\"interactive-hint\">모든 그래프가 동일 시간축 사용 · 각 그래프에 날짜·시간 X축 표시 · 현재선 오른쪽은 24시간 미래 빈 구간<\u002Fspan><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Wind Speed<\u002Fdiv><div class=\"chart-source\">km/s · 자료 범위에 따라 Y축 자동 확장 · 비정상 급락 제거 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-wind-speed\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap compact\"><canvas id=\"c-speed\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Proton Density<\u002Fdiv><div class=\"chart-source\">p/cm³ · Y축 자동 확장 · 열적 proton number density · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-density\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap compact\"><canvas id=\"c-density\"><\u002Fcanvas><\u002Fdiv><div class=\"scale-note\">Proton density는 태양풍 플라즈마의 저에너지·열적 양성자 개수밀도입니다. GOES의 ≥10, ≥50, ≥100, ≥500 MeV energetic proton flux처럼 에너지 임계값별 적분 플럭스로 제공되는 자료가 아닙니다.<\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Total IMF |B| (Bt)<\u002Fdiv><div class=\"chart-source\">NOAA RTSW Solar-1 bt · Y축 자동 확장 · nT · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-bt\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-bt\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF Bx (GSM)<\u002Fdiv><div class=\"chart-source\">자료 진폭에 따라 대칭 Y축 자동 확장 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-bx\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-bx\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF By (GSM)<\u002Fdiv><div class=\"chart-source\">자료 진폭에 따라 대칭 Y축 자동 확장 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-by\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-by\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF Bz (GSM)<\u002Fdiv><div class=\"chart-source\">자료 진폭에 따라 대칭 Y축 자동 확장 · southward Bz는 자기권 결합 강화 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-bz-wind\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-bz\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv>\n<div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">WSA–ENLIL Heliospheric Forecast<\u002Fdiv><div class=\"chart-source\">NOAA SWPC ENLIL spatial-distribution image frames · hourly model animation<\u002Fdiv><\u002Fdiv><div id=\"v-enlil\" class=\"live-value\">FORECAST<\u002Fdiv><\u002Fdiv><div class=\"enlil-controls\"><button id=\"enlil-play\" type=\"button\">▶ 재생<\u002Fbutton><button id=\"enlil-prev\" type=\"button\" aria-label=\"Previous ENLIL frame\">◀<\u002Fbutton><button id=\"enlil-next\" type=\"button\" aria-label=\"Next ENLIL frame\">▶<\u002Fbutton><input id=\"enlil-slider\" type=\"range\" min=\"0\" max=\"0\" value=\"0\" step=\"1\" aria-label=\"ENLIL forecast frame\"><div id=\"enlil-readout\" class=\"enlil-readout\">영상 프레임 목록을 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"enlil-frame-shell\"><img id=\"enlil-image\" alt=\"NOAA WSA-ENLIL heliospheric forecast spatial distribution\"><div id=\"enlil-frame-status\" class=\"enlil-frame-status\">ENLIL 공간 분포 영상을 불러오는 중...<\u002Fdiv><div id=\"enlil-time-badge\" class=\"enlil-time-badge\">-- UTC<\u002Fdiv><\u002Fdiv><div class=\"enlil-note\">NOAA가 제공하는 WSA–ENLIL 공간 분포 JPEG 프레임을 시간 순서대로 재생합니다. 프레임 목록이 갱신되지 않았거나 이미지 서버가 응답하지 않으면 마지막으로 공개된 모델 실행 시각까지만 표시됩니다. 이미지를 클릭하면 확대됩니다.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"geomag\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Geomagnetic Activity<\u002Fh2><p>Planetary Kp, GFZ Hp30, Geospace Dst를 시간축으로 비교<\u002Fp><\u002Fdiv><span class=\"interactive-hint\">공통 커서와 현재 시각 표시<\u002Fspan><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Planetary Kp<\u002Fdiv><div class=\"chart-source\">우측 라벨: NOAA G-scale 기준 G1(Kp 5)–G5(Kp 9) · <a href=\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-kp2\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-kp2\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">GFZ Hp30 Index<\u002Fdiv><div class=\"chart-source\" id=\"hp30-source-status\">30분 해상도 · 최근 7일 · <a id=\"hp30-source-link\" href=\"https://kp.gfz.de/en/hp30-hp60\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">GFZ 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-hp30\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-hp30\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Dst Index<\u002Fdiv><div class=\"chart-source\">nT · <a href=\"https://services.swpc.noaa.gov/json/geospace/geospace_dst_7_day.json\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-dst\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-dst\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"radiation\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Energetic Particle Flux<\u002Fh2><p>GOES integral proton and electron flux · 최근 7일<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Integral Proton Flux<\u002Fdiv><div class=\"chart-source\">GOES primary · NOAA S-scale는 ≥10 MeV 채널 기준 · <a href=\"https://services.swpc.noaa.gov/json/goes/primary/integral-protons-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-proton\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-proton\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Integral Electron Flux<\u002Fdiv><div class=\"chart-source\">GOES secondary · ≥0.8 MeV and ≥2 MeV · electrons/(cm²·s·sr) · <a href=\"https://services.swpc.noaa.gov/json/goes/secondary/integral-electrons-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-electron\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-electron\"><\u002Fcanvas><\u002Fdiv><div class=\"scale-note\">NOAA electron alert 기준은 ≥2 MeV flux 1,000 electrons/(cm²·s·sr)입니다. 강한 proton event 동안 ≥2 MeV electron 채널이 오염될 수 있습니다.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"ionosphere\" class=\"view\">\n  <section class=\"section\">\n    <div class=\"section-head\">\n      <div><h2>Global Ionosphere<\u002Fh2><p>NOAA SWPC GloTEC ultra-real-time global ionospheric specification<\u002Fp><\u002Fdiv>\n      <button id=\"reload-ionosphere\" type=\"button\">전리권 자료 새로고침<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"iono-toolbar\">\n      <div id=\"iono-time\" class=\"iono-time\">최신 GloTEC 자료 탐색 중...<\u002Fdiv>\n      <div id=\"iono-status\" class=\"iono-status\">GeoJSON 파일을 확인하고 있습니다.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"iono-controls\" aria-label=\"Ionosphere map controls\">\n      <div class=\"iono-control\"><span>보간 해상도<\u002Fspan><select id=\"iono-resolution\"><option value=\"1\">1×<\u002Foption><option value=\"2\" selected=\"\">2×<\u002Foption><option value=\"4\">4×<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"iono-control\"><span>Gaussian<\u002Fspan><input id=\"iono-smoothing\" type=\"range\" min=\"0\" max=\"5\" step=\"1\" value=\"2\"><output id=\"iono-smoothing-value\">2<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><span>채움 투명도<\u002Fspan><input id=\"iono-opacity\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"100\"><output id=\"iono-opacity-value\">100%<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><span>Contour<\u002Fspan><select id=\"iono-contours\"><option value=\"0\">없음<\u002Foption><option value=\"6\">6<\u002Foption><option value=\"10\" selected=\"\">10<\u002Foption><option value=\"14\">14<\u002Foption><option value=\"20\">20<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"iono-control\"><span>선 투명도<\u002Fspan><input id=\"iono-contour-alpha\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"50\"><output id=\"iono-contour-alpha-value\">50%<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-labels\" type=\"checkbox\" checked=\"\"> Contour 라벨<\u002Flabel><\u002Fdiv><div class=\"iono-control\"><label><input id=\"iono-show-map\" type=\"checkbox\" checked=\"\"> 대륙 해안선<\u002Flabel><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-grid\" type=\"checkbox\" checked=\"\"> 위·경도 격자<\u002Flabel><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-points\" type=\"checkbox\"> 원본 격자점<\u002Flabel><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"iono-grid\">\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global Total Electron Content<\u002Fdiv><div class=\"chart-source\">Vertical TEC · TECU · <a id=\"iono-source-tec\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-tec-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-tec\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">TEC는 위성–수신기 경로의 전자 수를 수직 방향으로 환산한 총전자량입니다. 1 TECU = 10¹⁶ electrons/m².<\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global NmF2<\u002Fdiv><div class=\"chart-source\">F2-layer peak electron density · <a id=\"iono-source-nmf2\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-nmf2-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-nmf2\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">NmF2는 전리권 F2층 최대 전자밀도입니다. 자료값이 m⁻³ 단위이면 지도에는 10¹² m⁻³ 단위로 환산해 표시합니다.<\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global hmF2<\u002Fdiv><div class=\"chart-source\">F2-layer peak height · km · <a id=\"iono-source-hmf2\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-hmf2-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-hmf2\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">hmF2는 F2층 최대 전자밀도가 나타나는 고도입니다.<\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsection>\n<section id=\"imagery\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Latest Solar Images<\u002Fh2><p>NOAA GOES/SUVI 및 SDO HMI 최신 영상 · 클릭하면 확대<\u002Fp><\u002Fdiv><button id=\"reload-solar-images\" type=\"button\">이미지 다시 불러오기<\u002Fbutton><\u002Fdiv><div class=\"images\"><article class=\"image-card\" data-label=\"GOES SUVI 195 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/195/latest.png\" alt=\"Latest GOES SUVI 195 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI 195 Å · corona<\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"GOES SUVI 304 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/304/latest.png\" alt=\"Latest GOES SUVI 304 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI 304 Å · chromosphere<\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"GOES SUVI 171 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/171/latest.png\" alt=\"Latest GOES SUVI 171 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI 171 Å · quiet corona<\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO HMI Continuum\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/sdo-hmii/latest.jpg\" alt=\"Latest SDO HMI continuum image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/HMI continuum · photosphere<\u002Fdiv><\u002Farticle><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"aurora\" class=\"view\"><div class=\"iframe-shell\"><div class=\"iframe-bar\"><div><strong>OVATION Aurora Monitoring<\u002Fstrong><br><span>Geographic probability + MLT–MLAT energy flux<\u002Fspan><\u002Fdiv><button id=\"open-aurora\">새 탭에서 열기 ↗<\u002Fbutton><\u002Fdiv><iframe id=\"aurora-frame\" src=\"about:blank#21600349-e991-4f6f-bb80-e4b6a7f65a77\" title=\"OVATION Aurora Monitoring\"><\u002Fiframe><\u002Fdiv><\u002Fsection>\n<footer class=\"footer\">Data sources: NOAA SWPC planetary K-index, Geospace Dst, RTSW solar wind and magnetic field, GOES X-ray, proton, and electron feeds, GloTEC ionosphere GeoJSON; NASA SDO latest imagery; GFZ Kp and Hp30 index.<\u002Ffooter>\n<\u002Fmain>\n<div id=\"modal\" class=\"modal\"><div class=\"modal-inner\"><button id=\"modal-close\">닫기<\u002Fbutton><img id=\"modal-img\" alt=\"Expanded solar image\"><\u002Fdiv><\u002Fdiv>\n<script async=\"\" src=\"1bd6270b-6485-459f-ba78-2c6726214c16\" onload=\"window.dispatchEvent(new Event('topojsonready'))\"><\u002Fscript>\n<script>\n\"use strict\";\nconst URL={scales:\"https://services.swpc.noaa.gov/products/noaa-scales.json\",kp:\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json\",kpForecast:\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json\",dst:\"https://services.swpc.noaa.gov/json/geospace/geospace_dst_7_day.json\",wind:\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\",mag:\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\",xray:\"https://services.swpc.noaa.gov/json/goes/primary/xrays-7-day.json\",xrayFallback:\"https://services.swpc.noaa.gov/json/goes/primary/xrays-1-day.json\",proton:\"https://services.swpc.noaa.gov/json/goes/primary/integral-protons-7-day.json\",electron:\"https://services.swpc.noaa.gov/json/goes/secondary/integral-electrons-7-day.json\",glotecManifest:\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt.json\",glotecBase:\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\",enlil:\"https://services.swpc.noaa.gov/products/animations/enlil.json\"};\nconst state={data:{},loading:false,enlilIndex:0,enlilPlaying:false,enlilTimer:null};const $=id=>document.getElementById(id);\nfunction parseUtc(v){if(!v)return NaN;const s=/Z$|[+-]\\d\\d:?\\d\\d$/.test(v)?v:v+\"Z\";return new Date(s).getTime()}\nasync function safeFetch(url,timeoutMs=20000){\n  const controller=new AbortController();\n  const timer=setTimeout(()=>controller.abort(),timeoutMs);\n  try{\n    const r=await fetch(url,{cache:\"no-store\",signal:controller.signal});\n    if(!r.ok)throw new Error(`${r.status} ${url}`);\n    const t=await r.text();\n    try{return JSON.parse(t)}catch(e){\n      const a=t.lastIndexOf(\"]\"),o=t.lastIndexOf(\"}\");\n      const i=Math.max(a,o);\n      if(i<0)throw new Error(`Invalid JSON: ${url}`);\n      return JSON.parse(t.slice(0,i+1));\n    }\n  }finally{clearTimeout(timer)}\n}\nasync function safeFetchAny(urls){\n  let lastError=null;\n  for(const url of urls){\n    try{return await safeFetch(url)}catch(e){lastError=e;console.warn('Source failed',url,e)}\n  }\n  throw lastError||new Error('No source URL available');\n}\nfunction activeRows(rows,fields){const seen=new Set(),out=[];for(const r of rows){if(!r.active||seen.has(r.time_tag))continue;seen.add(r.time_tag);const p={t:parseUtc(r.time_tag)};for(const f of fields)p[f]=Number(r[f]);out.push(p)}return out.sort((a,b)=>a.t-b.t)}\nfunction points(rows,key,filter=()=>true,transform=v=>v){return rows.filter(filter).map(r=>({t:parseUtc(r.time_tag),v:transform(Number(r[key]))})).filter(p=>Number.isFinite(p.t)&&Number.isFinite(p.v)).sort((a,b)=>a.t-b.t)}\nfunction median(values){\n  const a=values.filter(Number.isFinite).sort((x,y)=>x-y);\n  if(!a.length)return NaN;\n  const m=Math.floor(a.length/2);\n  return a.length%2?a[m]:(a[m-1]+a[m])/2;\n}\nfunction filterDownwardOutliers(data,{physicalMin,ratio,absoluteDrop,window=7}){\n  if(!Array.isArray(data)||data.length<5)return data||[];\n  const kept=[];\n  for(let i=0;i<data.length;i++){\n    const p=data[i];\n    if(!Number.isFinite(p.v)||p.v<physicalMin)continue;\n    const lo=Math.max(0,i-window),hi=Math.min(data.length,i+window+1);\n    const neighborhood=[];\n    for(let j=lo;j<hi;j++){\n      if(j===i)continue;\n      const v=data[j].v;\n      if(Number.isFinite(v)&&v>=physicalMin)neighborhood.push(v);\n    }\n    const localMedian=median(neighborhood);\n    const isSharpDrop=Number.isFinite(localMedian)&&p.v<localMedian*ratio&&(localMedian-p.v)>absoluteDrop;\n    if(!isSharpDrop)kept.push(p);\n  }\n  return kept;\n}\nfunction latestPoint(a){return a&&a.length?a[a.length-1]:null}function latest(a){const p=latestPoint(a);return p?p.v:NaN}function fmt(v,n=1){return Number.isFinite(v)?v.toFixed(n):\"--\"}\nfunction setStatus(text,type=\"normal\"){$(\"status-text\").textContent=text;$('status-dot').className='dot'+(type==='good'?' good':type==='error'?' error':'')}\nfunction setCanvasSize(c){const d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=Math.max(300,Math.floor(r.width*d));c.height=Math.max(180,Math.floor(r.height*d));return {ctx:c.getContext('2d'),W:c.width,H:c.height,d}}\nfunction niceRange(values,zero=false){let lo=Math.min(...values),hi=Math.max(...values);if(!Number.isFinite(lo)||!Number.isFinite(hi)){lo=0;hi=1}if(zero)lo=Math.min(0,lo);if(lo===hi){lo-=1;hi+=1}const pad=(hi-lo)*.12;return [lo-pad,hi+pad]}\nconst chartGroups={overview:{hover:null,ids:['c-kp','c-overview-dst','c-overview-wind','c-overview-bz']},wind:{hover:null,ids:['c-speed','c-density','c-bt','c-bx','c-by','c-bz']},geomag:{hover:null,ids:['c-kp2','c-hp30','c-dst']},solar:{hover:null,ids:['c-xray']},radiation:{hover:null,ids:['c-proton','c-electron']}};\nconst groupMargins={overview:{l:76,r:92},wind:{l:76,r:92},geomag:{l:76,r:92},solar:{l:76,r:92},radiation:{l:76,r:108}};\nconst FUTURE_WINDOW_MS=24*60*60*1000;\nconst WIND_CACHE_KEY='swx-wind-history-v1',WIND_CACHE_DAYS=5,WIND_HISTORY_DIR='./data/wind-history';\nfunction readWindCache(){try{const x=JSON.parse(localStorage.getItem(WIND_CACHE_KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(e){console.warn('Wind cache read failed',e);return {}}}\nfunction mergeHistory(oldSeries,newSeries,days=WIND_CACHE_DAYS){const cutoff=Date.now()-days*864e5,m=new Map();for(const p of [...(Array.isArray(oldSeries)?oldSeries:[]),...(Array.isArray(newSeries)?newSeries:[])]){if(Number.isFinite(p?.t)&&Number.isFinite(p?.v)&&p.t>=cutoff)m.set(p.t,{t:p.t,v:p.v})}return [...m.values()].sort((a,b)=>a.t-b.t)}\nfunction saveWindCache(cache){try{localStorage.setItem(WIND_CACHE_KEY,JSON.stringify(cache))}catch(e){console.warn('Wind cache save failed',e)}}\nlet repoWindHistoryPromise=null;\nfunction loadRepoWindHistory(){\n  if(repoWindHistoryPromise)return repoWindHistoryPromise;\n  repoWindHistoryPromise=(async()=>{\n    const out={speed:[],density:[],bt:[],bx:[],by:[],bz:[]};\n    try{\n      const manifestRes=await fetch(`${WIND_HISTORY_DIR}/manifest.json?t=${Date.now()}`,{cache:'no-store'});\n      if(!manifestRes.ok)return out;\n      const days=await manifestRes.json();\n      const recentDays=(Array.isArray(days)?days:[]).slice(-WIND_CACHE_DAYS);\n      const texts=await Promise.all(recentDays.map(d=>fetch(`${WIND_HISTORY_DIR}/${d}.jsonl?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.ok?r.text():'').catch(()=>'')));\n      for(const text of texts){\n        for(const line of text.split('\\n')){\n          if(!line.trim())continue;\n          let p;try{p=JSON.parse(line)}catch(e){continue}\n          if(!Number.isFinite(p.t))continue;\n          for(const k of ['speed','density','bt','bx','by','bz'])if(Number.isFinite(p[k]))out[k].push({t:p.t,v:p[k]});\n        }\n      }\n    }catch(e){console.warn('Repo wind history load failed',e)}\n    return out;\n  })();\n  return repoWindHistoryPromise;\n}\nconst chartSpecs={};\nfunction drawPowerTick(ctx,x,y,exp,scale,align='right'){\n  ctx.save();ctx.fillStyle='#9eb1c8';ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=`${17*scale}px sans-se sFinite(r.lon))return{lat:r.lat,lon:r.lon};\n    r=r.loc;\n  }\n  const m=String(r||'').trim().match(/^([NS])(\\d{1,2})([EW])(\\d{1,3})$/i);if(!m)return null;\n  return{lat:(m[1].toUpperCase()==='N'?1:-1)*Number(m[2]),lon:(m[3].toUpperCase()==='W'?1:-1)*Number(m[4])};\n}\nfunction regionColor(r){if((r.x||0)>=10||/delta|βγδ|bgd/i.test(r.mag||''))return'#ff5c7a';if((r.m||0)>=15)return'#ffb84d';if((r.c||0)>=40)return'#59d0ff';return'#6de28a'}\nfunction loadSolarDiskImage(){\n  const img=document.getElementById('solar-disk-image'),st=document.getElementById('solar-disk-image-status');if(!img)return;\n  st.textContent='최신 HMI 영상 불러오는 중...';\n  img.onload=()=>{st.textContent='NASA SDO/HMI latest';requestAnimationFrame(()=>drawSolarDisk())};\n  img.onerror=()=>{st.textContent='HMI 영상 로딩 실패';drawSolarDisk()};\n  img.src='https://sdo.gsfc.nasa.gov/assets/img/latest/latest_512_HMIIC.jpg?t='+Date.now();\n}\n\nfunction solarEphemeris(date=new Date()){\n  const jd=date.getTime()/86400000+2440587.5, n=jd-2451545.0, rad=Math.PI/180;\n  const L=(280.460+0.9856474*n)%360;\n  const g=(357.528+0.9856003*n)%360;\n  const lambda=(L+1.915*Math.sin(g*rad)+0.020*Math.sin(2*g*rad))*rad;\n  const eps=(23.439-0.0000004*n)*rad;\n  const alpha=Math.atan2(Math.cos(eps)*Math.sin(lambda),Math.cos(lambda));\n  const delta=Math.asin(Math.sin(eps)*Math.sin(lambda));\n  const ap=286.13*rad, dp=63.87*rad;\n  const B0=-Math.asin(Math.sin(delta)*Math.sin(dp)+Math.cos(delta)*Math.cos(dp)*Math.cos(alpha-ap));\n  const P=Math.atan2(Math.cos(dp)*Math.sin(ap-alpha),Math.sin(dp)*Math.cos(delta)-Math.cos(dp)*Math.sin(delta)*Math.cos(ap-alpha));\n  return {B0,P};\n}\nfunction projectHeliographic(latDeg,westDeg,date=new Date()){\n  const rad=Math.PI/180, lat=latDeg*rad, L=westDeg*rad, {B0}=solarEphemeris(date);\n  // Stonyhurst heliographic coordinates projected onto a solar-north-up HMI image.\n  // The NASA latest HMI JPEG is already oriented with solar north upward, so P-angle\n  // must NOT be applied again. Applying it twice mixes longitude into screen latitude.\n  const x=Math.cos(lat)*Math.sin(L);\n  const y=Math.sin(lat)*Math.cos(B0)-Math.cos(lat)*Math.cos(L)*Math.sin(B0);\n  const z=Math.sin(lat)*Math.sin(B0)+Math.cos(lat)*Math.cos(L)*Math.cos(B0);\n  if(z<0)return null;\n  return {x,y,z};\n}\nfunction drawSolarDisk(){\n  const cvs=document.getElementById('solar-disk');\n  const layer=document.getElementById('solar-region-label-layer');\n  if(!cvs)return 0;\n  const ctx=cvs.getContext('2d');\n  ctx.clearRect(0,0,cvs.width,cvs.height);\n  cvs._markers=[];\n  if(layer) layer.innerHTML='';\n  let shown=0;\n  solarRegionsData.forEach(r=>{\n    const pos=parseRegionLoc(r);if(!pos)return;\n    const q=projectHeliographic(pos.lat,pos.lon,new Date());if(!q)return;\n    const xp=50-q.x*46.8, yp=50-q.y*46.8;\n    if(xp<1||xp>99||yp<1||yp>99)return;\n    const px=xp/100*cvs.width, py=yp/100*cvs.height;\n    const selected=selectedRegion&&String(selectedRegion.ar)===String(r.ar);\n\n    // Reliable canvas fallback: always draw the AR number directly above the HMI image.\n    ctx.save();\n    ctx.font='900 21px Inter, Arial, sans-serif';\n    ctx.textAlign='center';\n    ctx.textBaseline='middle';\n    ctx.lineJoin='round';\n    ctx.lineWidth=5;\n    ctx.strokeStyle='rgba(0,0,0,.96)';\n    ctx.strokeText(`AR ${r.ar}`,px,py-30);\n    ctx.fillStyle=selected?'#7ee7b7':'#ffffff';\n    ctx.fillText(`AR ${r.ar}`,px,py-30);\n    if(selected){\n      ctx.beginPath();\n      ctx.setLineDash([9,7]);\n      ctx.lineWidth=3;\n      ctx.strokeStyle='rgba(255,255,255,.95)';\n      ctx.arc(px,py,38,0,Math.PI*2);\n      ctx.stroke();\n      ctx.setLineDash([]);\n    }\n    ctx.restore();\n\n    cvs._markers.push({x:px,y:py,r:58*cvs.width/1200,data:r});\n    shown++;\n  });\n  const st=document.getElementById('solar-disk-image-status');\n  if(st) st.textContent=`NASA SDO/HMI latest · AR labels ${shown}`;\n  return shown;\n}\nfunction renderRegionCards(){\n  const panel=document.getElementById('solar-regions-panel');\n  panel.innerHTML=solarRegionsData.map(r=>{const sev=severityFromMag(r.mag,r.m,r.x);return `<div class=\"region-card\" data-ar=\"${r.ar}\"><div class=\"region-head\"><div><div class=\"region-ar\">AR ${r.ar}<\u002Fdiv><div class=\"region-loc\">${r.loc}<\u002Fdiv><\u002Fdiv><div class=\"region-badge\" style=\"${sev[1]}\">${sev[0]}<\u002Fdiv><\u002Fdiv><div class=\"region-meta\"><div class=\"meta-box\"><div class=\"meta-k\">Magnetic<\u002Fdiv><div class=\"meta-v\">${r.mag}<\u002Fdiv><\u002Fdiv><div class=\"meta-box\"><div class=\"meta-k\">McIntosh<\u002Fdiv><div class=\"meta-v\">${r.mc}<\u002Fdiv><div class=\"mc-level\">${mcIntoshComplexity(r.mc).level}<\u002Fdiv><\u002Fdiv><div class=\"meta-box\"><div class=\"meta-k\">Area<\u002Fdiv><div class=\"meta-v\">${r.area}<\u002Fdiv><\u002Fdiv><div class=\"meta-box\"><div class=\"meta-k\">Spots<\u002Fdiv><div class=\"meta-v\">${r.spots}<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"region-bars\">${[['C',r.c,'#44d17a'],['M',r.m,'#ffb84d'],['X',r.x,'#ff5c7a']].map(v=>`<div class=\"forecast-row\"><div class=\"forecast-label\">${v[0]}<\u002Fdiv><div class=\"prob-bar\"><div class=\"prob-fill\" style=\"width:${Math.max(0,Math.min(100,v[1]))}%;background:${v[2]}\"><\u002Fdiv><\u002Fdiv><div class=\"prob-val\">${v[1]}%<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv><\u002Fdiv>`}).join('');\n  panel.querySelectorAll('.region-card').forEach(el=>{el.style.cursor='pointer';el.onclick=()=>{const r=solarRegionsData.find(x=>String(x.ar)===el.dataset.ar);if(r)showRegionDetail(r)}});\n}\nfunction getSunspotSeries(ar){\n  const key=String(ar),byDay={};\n  const addRow=(raw,source)=>{\n    const rawAr=firstValue(raw,['region','region_number','ar','active_region','noaa_region','noaa_ar','region_id'],'');\n    if(String(rawAr)!==key)return;\n    const row=normalizeRegion(raw), ds=(row.observed||obsTime(raw)).slice(0,10);\n    if(!ds)return;\n    const candidate={date:ds,area:row.area,spots:row.spots,loc:row.loc,source};\n    const old=byDay[ds];\n    if(!old || candidate.area>old.area || (candidate.area===old.area&&candidate.spots>old.spots))byDay[ds]=candidate;\n  };\n  // solar_regions.json itself contains multiple dated records and provides the most\n  // reliable AR-number linkage. Use it as the primary history source.\n  for(const raw of solarRegionHistoryData||[])addRow(raw,'solar_regions');\n  // Add matching observatory reports when sunspot_report exposes a NOAA region number.\n  for(const raw of sunspotReportData||[])addRow(raw,'sunspot_report');\n  return Object.values(byDay).sort((a,b)=>a.date.localeCompare(b.date)).slice(-14);\n}\nfunction drawSpark(canvasId,series,key,color,label){const c=document.getElementById(canvasId);if(!c)return;const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(255,255,255,.1)';for(let i=0;i<4;i++){const yy=12+i*(h-28)/3;ctx.beginPath();ctx.moveTo(40,yy);ctx.lineTo(w-10,yy);ctx.stroke()}if(!series.length){ctx.fillStyle='#9fb5d1';ctx.font='14px system-ui';ctx.fillText('No recent region history is available for this AR.',12,h/2);return}const vals=series.map(d=>Number(d[key]||0)),min=Math.min(...vals),max=Math.max(...vals,min+1),x=i=>40+(w-55)*(series.length===1?.5:i/(series.length-1)),y=v=>h-22-(h-42)*((v-min)/(max-min||1));ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();series.forEach((d,i)=>i?ctx.lineTo(x(i),y(d[key])):ctx.moveTo(x(i),y(d[key])));ctx.stroke();ctx.fillStyle=color;series.forEach((d,i)=>{ctx.beginPath();ctx.arc(x(i),y(d[key]),3.5,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#d7e8ff';ctx.font='12px system-ui';ctx.fillText(`${label} (${min}–${max})`,10,14);ctx.textAlign='center';series.forEach((d,i)=>{ctx.fillStyle='#8ea6c6';ctx.fillText(d.date.slice(5),x(i),h-5)})}\nfunction showRegionDetail(r){selectedRegion=r;requestAnimationFrame(()=>drawSolarDisk());const box=document.getElementById('region-detail-panel'),series=getSunspotSeries(r.ar);box.innerHTML=`<h4>AR ${r.ar}<\u002Fh4><div class=\"muted\">${r.loc} · Magnetic ${r.mag} · McIntosh ${r.mc} (${mcIntoshComplexity(r.mc).level})<\u002Fdiv><div class=\"mc-explain\"><strong>McIntosh 복잡도:<\u002Fstrong> ${mcIntoshComplexity(r.mc).detail}<\u002Fdiv><div class=\"region-stats\"><div class=\"trend-box\"><div class=\"k\">Current Area<\u002Fdiv><div class=\"v\">${r.area}<\u002Fdiv><\u002Fdiv><div class=\"trend-box\"><div class=\"k\">Current Spots<\u002Fdiv><div class=\"v\">${r.spots}<\u002Fdiv><\u002Fdiv><div class=\"trend-box\"><div class=\"k\">M Probability<\u002Fdiv><div class=\"v\">${r.m}%<\u002Fdiv><\u002Fdiv><div class=\"trend-box\"><div class=\"k\">X Probability<\u002Fdiv><div class=\"v\">${r.x}%<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"spark-wrap\"><h5>Area Trend<\u002Fh5><canvas id=\"spark-area\" class=\"spark\"><\u002Fcanvas><\u002Fdiv><div class=\"spark-wrap\"><h5>Spot Count Trend<\u002Fh5><canvas id=\"spark-spots\" class=\"spark\"><\u002Fcanvas><\u002Fdiv><div class=\"sunspot-mini-table\"><div class=\"sunspot-mini-row sunspot-mini-head\"><div>Date<\u002Fdiv><div>Location<\u002Fdiv><div>Area<\u002Fdiv><div>Spots<\u002Fdiv><\u002Fdiv>${series.map(s=>`<div class=\"sunspot-mini-row\"><div>${s.date}<\u002Fdiv><div>${s.loc}<\u002Fdiv><div>${s.area}<\u002Fdiv><div>${s.spots}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv><div class=\"data-source-note\">Area and spot-count history uses NOAA SWPC daily composite region observations. These are combined reports from multiple observatories and may not represent a single instantaneous measurement.<br><a href=\"https://services.swpc.noaa.gov/json/solar_regions.json\" target=\"_blank\" rel=\"noopener\">solar_regions.json ↗<\u002Fa> · <a href=\"https://services.swpc.noaa.gov/json/sunspot_report.json\" target=\"_blank\" rel=\"noopener\">sunspot_report.json ↗<\u002Fa> · <a href=\"https://www.spaceweather.gov/products/summary-space-weather-observations\" target=\"_blank\" rel=\"noopener\">NOAA product description ↗<\u002Fa><\u002Fdiv>`;requestAnimationFrame(()=>{drawSpark('spark-area',series,'area','#ffb84d','Area');drawSpark('spark-spots',series,'spots','#59d0ff','Spots')})}\nasync function loadSunspotReport(){try{const r=await fetch('https://services.swpc.noaa.gov/json/sunspot_report.json?t='+Date.now(),{cache:'no-store'});sunspotReportData=await r.json()}catch(e){console.warn('sunspot_report failed',e);sunspotReportData=[]}}\nasync function loadSolarRegions(){\n  const status=document.getElementById('solar-regions-status');\n  try{\n    status.textContent='Updating...';const res=await fetch('https://services.swpc.noaa.gov/json/solar_regions.json?t='+Date.now(),{cache:'no-store'}),data=await res.json();\n    const rawRows=Array.isArray(data)?data:[];const norm=rawRows.map(normalizeRegion).filter(r=>r.ar!=='-');solarRegionHistoryData=rawRows;\n    const latestDate=norm.map(r=>r.observed.slice(0,10)).filter(Boolean).sort().pop()||'';\n    const candidates=latestDate?norm.filter(r=>r.observed.startsWith(latestDate)):norm;\n    const byAr=new Map();for(const r of candidates){const old=byAr.get(String(r.ar));if(!old||r.observed>old.observed)byAr.set(String(r.ar),r)}\n    solarRegionsData=[...byAr.values()].sort((a,b)=>(b.x*100+b.m*10+b.area)-(a.x*100+a.m*10+a.area));\n    renderRegionCards();drawSolarDisk();status.textContent=`Updated · ${solarRegionsData.length} active regions · ${latestDate||'latest'}`;\n    if(solarRegionsData.length){const keep=solarRegionsData.find(r=>selectedRegion&&String(r.ar)===String(selectedRegion.ar));showRegionDetail(keep||solarRegionsData[0])}\n  }catch(e){status.textContent='Failed to load active regions';console.error(e)}\n}\nconst disk=document.getElementById('solar-disk');if(disk){disk.addEventListener('mousemove',ev=>{const r=disk.getBoundingClientRect(),x=(ev.clientX-r.left)*(disk.width/r.width),y=(ev.clientY-r.top)*(disk.height/r.height);disk.style.cursor=(disk._markers||[]).some(m=>Math.hypot(m.x-x,m.y-y)<=m.r)?'pointer':'zoom-in'});disk.addEventListener('click',ev=>{const r=disk.getBoundingClientRect(),x=(ev.clientX-r.left)*(disk.width/r.width),y=(ev.clientY-r.top)*(disk.height/r.height),hit=(disk._markers||[]).find(m=>Math.hypot(m.x-x,m.y-y)<=m.r);if(hit){showRegionDetail(hit.data);return}const img=document.getElementById('solar-disk-image');if(img&&img.src){document.getElementById('modal-img').src=img.src;document.getElementById('modal-img').alt='Latest NASA SDO HMI continuum solar disk';document.getElementById('modal').classList.add('open')}})}\nloadSolarProbabilities();\nPromise.allSettled([loadSunspotReport(),loadSolarRegions()]).then(()=>loadSolarRegions());\nloadSolarDiskImage();\nsetInterval(loadSolarProbabilities,30*60*1000);setInterval(()=>{loadSunspotReport().then(loadSolarRegions)},60*60*1000);setInterval(loadSolarDiskImage,10*60*1000);\n\nwindow.addEventListener('resize',()=>requestAnimationFrame(()=>drawSolarDisk()));\nsetTimeout(()=>drawSolarDisk(),1500);\nsetTimeout(()=>drawSolarDisk(),3500);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
