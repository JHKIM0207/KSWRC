  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ckbox\"]{accent-color:#6fd6ff}\n.iono-map-wrap{height:560px}\n@media(max-width:760px){.iono-controls{gap:10px}.iono-control{width:100%;justify-content:space-between}.iono-control input[type=\"range\"]{flex:1}.iono-map-wrap{height:360px}}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<main class=\"app\">\n<header class=\"header\">\n  <div class=\"title\"><h1 id=\"home-title\" style=\"cursor:pointer\">Space Weather Monitoring for Heliospheric Research<\u002Fh1><p>NOAA SWPC &amp; NASA SDO &amp; GFZ 실시간 자료를 이용한 태양권 우주환경 통합 모니터링 시스템<\u002Fp><\u002Fdiv>\n  <div class=\"header-actions\"><div class=\"header-actions-top\" style=\"width: 315px; height: 40px\"><a href=\"https://www.kasi.re.kr/\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"96629adf-022b-457f-a646-1bfbee1f2f1e\" alt=\"한국천문연구원 우주환경연구센터\" class=\"header-logo\" style=\"width: 183px; height: 73px\"><\u002Fa><button id=\"refresh\">전체 새로고침<\u002Fbutton><\u002Fdiv><div class=\"status\"><span id=\"status-dot\" class=\"dot\"><\u002Fspan><span id=\"status-text\">데이터 확인 중...<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fheader>\n<nav class=\"nav\" aria-label=\"Dashboard navigation\">\n  <button class=\"active\" data-view=\"overview\">Overview<\u002Fbutton><button data-view=\"solar\">Solar Activity<\u002Fbutton><button data-view=\"imagery\">Solar Images<\u002Fbutton><button data-view=\"wind\">Solar Wind<\u002Fbutton><button data-view=\"geomag\">Geomagnetic<\u002Fbutton><button data-view=\"radiation\">Magnetosphere<\u002Fbutton><button data-view=\"ionosphere\">Ionosphere<\u002Fbutton><button data-view=\"aurora\">Aurora<\u002Fbutton><button data-view=\"report\">우주환경리포트 제출<\u002Fbutton>\n  <div class=\"links-menu\">\n    <button type=\"button\" class=\"links-btn\" id=\"links-btn\">우주환경 관련 사이트 ▾<\u002Fbutton>\n    <div class=\"links-dropdown\" id=\"links-dropdown\">\n      <a href=\"https://kswrc.kasi.re.kr/ko/main\" target=\"_blank\" rel=\"noopener noreferrer\">한국천문연구원-우주환경연구센터 (KSWRC)<\u002Fa>\n      <a href=\"https://spaceweather.kasa.go.kr/main.do\" target=\"_blank\" rel=\"noopener noreferrer\">우주항공청-우주환경센터<\u002Fa>\n      <a href=\"https://www.sidc.be/cactus/out/latestCMEs.html\" target=\"_blank\" rel=\"noopener noreferrer\">CACTUS CME list<\u002Fa>\n      <a href=\"https://www.lmsal.com/solarsoft/latest_events/\" target=\"_blank\" rel=\"noopener noreferrer\">SolarSoft list<\u002Fa>\n      <a href=\"https://solarmonitor.org/\" target=\"_blank\" rel=\"noopener noreferrer\">SolarMonitor<\u002Fa>\n      <a href=\"http://spaceweather.gmu.edu/seeds/realtime.php\" target=\"_blank\" rel=\"noopener noreferrer\">SEEDS<\u002Fa>\n      <a href=\"https://wdc.kugi.kyoto-u.ac.jp/ae_realtime/today/today.html\" target=\"_blank\" rel=\"noopener noreferrer\">AE index<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<section id=\"overview\" class=\"view active\">\n  <div class=\"hero-grid\">\n    <article class=\"metric\"><div class=\"metric-label\">Planetary Kp<\u002Fdiv><div><span id=\"m-kp\" class=\"metric-value\">--<\u002Fspan><\u002Fdiv><div id=\"m-kp-foot\" class=\"metric-foot\">NOAA planetary K-index<\u002Fdiv><\u002Farticle>\n    <article class=\"metric\"><div class=\"metric-label\">Dst Index<\u002Fdiv><div><span id=\"m-dst\" class=\"metric-value\">--<\u002Fspan><span class=\"metric-unit\">nT<\u002Fspan><\u002Fdiv><div class=\"metric-foot\">Geospace model<\u002Fdiv><\u002Farticle>\n    <article class=\"metric\"><div class=\"metric-label\">Wind Speed<\u002Fdiv><div><span id=\"m-speed\" class=\"metric-value\">--<\u002Fspan><span class=\"metric-unit\">km/s<\u002Fspan><\u002Fdiv><div class=\"metric-foot\">Active RTSW spacecraft<\u002Fdiv><\u002Farticle>\n    <article class=\"metric\"><div class=\"metric-label\">IMF Bz GSM<\u002Fdiv><div><span id=\"m-bz\" class=\"metric-value\">--<\u002Fspan><span class=\"metric-unit\">nT<\u002Fspan><\u002Fdiv><div id=\"m-bz-foot\" class=\"metric-foot\">Southward Bz enhances coupling<\u002Fdiv><\u002Farticle>\n  <\u002Fdiv>\n  <section class=\"section\"><div class=\"section-head\"><div><h2>NOAA Space Weather Scales<\u002Fh2><p>현재 R, S, G 단계 요약<\u002Fp><\u002Fdiv><span id=\"scale-time\" class=\"chart-source\">--<\u002Fspan><\u002Fdiv><div class=\"scale-row\" id=\"scale-row\"><\u002Fdiv><\u002Fsection>\n  \n  <section class=\"section\"><div class=\"section-head\"><div><h2>Current Conditions<\u002Fh2><p>핵심 지표를 한 화면에서 비교<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"grid-2\" style=\"grid-auto-flow:column;grid-template-rows:repeat(3,auto)\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">GOES X-ray Flux<\u002Fdiv><div class=\"chart-source\">GOES 0.1–0.8 nm soft X-ray<\u002Fdiv><\u002Fdiv><div id=\"v-xray-overview\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-overview-xray\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"solar\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Energetic Particle Flux<\u002Fdiv><div class=\"chart-source\">GOES integral proton flux<\u002Fdiv><\u002Fdiv><div id=\"v-proton-overview\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-overview-proton\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"radiation\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Kp index<\u002Fdiv><div class=\"chart-source\">NOAA planetary K-index<\u002Fdiv><\u002Fdiv><div id=\"v-kp\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-kp\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"geomag\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Solar Wind<\u002Fdiv><div class=\"chart-source\">NOAA RTSW 1-minute data<\u002Fdiv><\u002Fdiv><div id=\"v-speed\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-overview-wind\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"wind\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF Bz<\u002Fdiv><div class=\"chart-source\">NOAA RTSW 1-minute data<\u002Fdiv><\u002Fdiv><div id=\"v-bz-overview\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-overview-bz\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"wind\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Dst Index<\u002Fdiv><div class=\"chart-source\">NOAA Real-time Geospace model Dst<\u002Fdiv><\u002Fdiv><div id=\"v-dst-overview\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-overview-dst\"><\u002Fcanvas><\u002Fdiv><div class=\"chart-actions\"><button type=\"button\" class=\"details-btn\" data-goto=\"geomag\">Details →<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section class=\"section\"><div class=\"section-head\"><div><h2>Latest event list<\u002Fh2><\u002Fdiv><span id=\"donki-time\" class=\"chart-source\">--<\u002Fspan><\u002Fdiv><div class=\"event-grid\"><div class=\"event-col\"><h4>Coronal Mass Ejections<\u002Fh4><div class=\"scale-note\" style=\"margin:-4px 0 6px\">SIDC CACTUS 자동 검출 · 클릭하면 5일치 전체 목록<\u002Fdiv><div id=\"cme-list\" class=\"event-list\"><\u002Fdiv><\u002Fdiv><div class=\"event-col\"><h4>Solar Flares<\u002Fh4><div id=\"flr-list\" class=\"event-list\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"event-grid event-grid-3\"><div class=\"event-col\"><h4>Geomagnetic Storms<\u002Fh4><div class=\"scale-note\" style=\"margin:-4px 0 6px\">NOAA Kp 실시간 자동 감지 (G1+)<\u002Fdiv><div id=\"gst-list\" class=\"event-list\"><\u002Fdiv><\u002Fdiv><div class=\"event-col\"><h4>Solar Proton Events<\u002Fh4><div class=\"scale-note\" style=\"margin:-4px 0 6px\">NOAA proton flux 실시간 자동 감지 (S1+)<\u002Fdiv><div id=\"sep-list\" class=\"event-list\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<\u002Fsection>\n\n<section id=\"solar\" class=\"view\">\n<section class=\"section\">\n  <div class=\"section-head\"><div><h2>Solar X-ray Flux<\u002Fh2><p>GOES 0.1–0.8 nm soft X-ray flux · logarithmic scale · <a href=\"https://services.swpc.noaa.gov/json/goes/primary/xrays-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fp><\u002Fdiv><div id=\"v-xray\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n  <div class=\"chart-card\"><div class=\"canvas-wrap tall\"><canvas id=\"c-xray\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv>\n  <div id=\"solar-flare-list\" style=\"margin-top:12px;display:flex;flex-direction:column;gap:8px\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"section\">\n  <div class=\"section-head\"><div><h2>3-Day Flare &amp; Proton Forecast<\u002Fh2><p>NOAA SWPC 전 태양면 C/M/X급 플레어 및 ≥10 MeV proton event 확률<\u002Fp><\u002Fdiv><span id=\"solar-probabilities-status\" class=\"chart-source\">불러오는 중...<\u002Fspan><\u002Fdiv>\n  <div id=\"solar-probabilities-panel\" class=\"forecast-grid\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"section\">\n  <div class=\"section-head\"><div><h2>Active Solar Regions<\u002Fh2><p>현재 NOAA 활동영역의 위치, 복잡도 및 플레어 잠재력<\u002Fp><\u002Fdiv><span id=\"solar-regions-status\" class=\"chart-source\">불러오는 중...<\u002Fspan><\u002Fdiv>\n  <div id=\"solar-regions-panel\" class=\"regions-grid\"><\u002Fdiv>\n            <div class=\"solar-disk-wrap\">\n              <div class=\"solar-disk-panel\">\n                <h4 style=\"margin:0 0 8px;font-size:20px\">Active Regions on Solar Disk<\u002Fh4>\n                <div class=\"solar-image-stage\">\n                  <img id=\"solar-disk-image\" alt=\"Latest NASA SDO HMI continuum solar image\" referrerpolicy=\"no-referrer\">\n                  <canvas id=\"solar-disk\" width=\"1200\" height=\"1200\"><\u002Fcanvas><div id=\"solar-region-label-layer\" aria-label=\"Active region labels\"><\u002Fdiv><svg id=\"solar-region-overlay\" viewBox=\"0 0 1000 1000\" preserveAspectRatio=\"none\" aria-label=\"Active region labels\"><\u002Fsvg>\n                  <div id=\"solar-disk-image-status\" class=\"disk-image-status\">최신 HMI 영상 불러오는 중...<\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"disk-help\">NOAA Stonyhurst coordinates projected onto the solar-north-up HMI disk using the current solar B0. Click an empty area to enlarge the image.<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"region-detail\" id=\"region-detail-panel\">\n                <h4>Select an active region<\u002Fh4>\n                <div class=\"muted\">Click a marker on the solar disk or a region card below to view recent sunspot report trends.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n<\u002Fsection>\n<section class=\"section\">\n  <article class=\"solar-cycle-card\"><div class=\"solar-cycle-top\"><div><div class=\"solar-cycle-title\">Solar Cycle 25 Prediction<\u002Fdiv><div class=\"solar-cycle-source\">NOAA SWPC experimental solar-cycle update · sunspot number and F10.7 cm radio flux<\u002Fdiv><\u002Fdiv><button id=\"reload-solar-cycle\" type=\"button\">이미지 새로고침<\u002Fbutton><\u002Fdiv><div class=\"solar-cycle-image-wrap\"><img id=\"solar-cycle-image\" data-base-src=\"https://services.swpc.noaa.gov/json/solar-cycle/cycle_update.png\" alt=\"NOAA experimental Solar Cycle 25 prediction\" referrerpolicy=\"no-referrer\"><div id=\"solar-cycle-status\" class=\"solar-cycle-status\">태양주기 예측 이미지를 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"solar-cycle-note\">NOAA SWPC가 제공하는 Experimental Solar Cycle 25 Prediction 이미지입니다. 검은색은 월별 관측값, 파란색은 평활 관측값이며, 보라색 영역은 향후 예측 구간을 나타냅니다.<\u002Fdiv><\u002Farticle>\n<\u002Fsection>\n<\u002Fsection>\n<section id=\"wind\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Solar Wind<\u002Fh2><p>NOAA SWPC RTSW <strong>Solar-1<\u002Fstrong> 1분 자료 · GitHub Actions로 누적한 최근 5일과 현재 이후 24시간 빈 구간<\u002Fp><div class=\"data-source-note\">Data source: <strong>NOAA SWPC RTSW Solar-1<\u002Fstrong> · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">Solar-wind plasma 원본 JSON<\u002Fa> · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">IMF 원본 JSON<\u002Fa><\u002Fdiv><\u002Fdiv><span class=\"interactive-hint\">모든 그래프가 동일 시간축 사용 · 각 그래프에 날짜·시간 X축 표시 · 현재선 오른쪽은 24시간 미래 빈 구간<\u002Fspan><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Wind Speed<\u002Fdiv><div class=\"chart-source\">km/s · 자료 범위에 따라 Y축 자동 확장 · 비정상 급락 제거 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-wind-speed\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap compact\"><canvas id=\"c-speed\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Proton Density<\u002Fdiv><div class=\"chart-source\">p/cm³ · Y축 자동 확장 · 열적 proton number density · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-density\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap compact\"><canvas id=\"c-density\"><\u002Fcanvas><\u002Fdiv><div class=\"scale-note\">Proton density는 태양풍 플라즈마의 저에너지·열적 양성자 개수밀도입니다. GOES의 ≥10, ≥50, ≥100, ≥500 MeV energetic proton flux처럼 에너지 임계값별 적분 플럭스로 제공되는 자료가 아닙니다.<\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Total IMF |B| (Bt)<\u002Fdiv><div class=\"chart-source\">NOAA RTSW Solar-1 bt · Y축 자동 확장 · nT · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-bt\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-bt\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF Bx (GSM)<\u002Fdiv><div class=\"chart-source\">자료 진폭에 따라 대칭 Y축 자동 확장 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-bx\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-bx\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF By (GSM)<\u002Fdiv><div class=\"chart-source\">자료 진폭에 따라 대칭 Y축 자동 확장 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-by\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-by\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">IMF Bz (GSM)<\u002Fdiv><div class=\"chart-source\">자료 진폭에 따라 대칭 Y축 자동 확장 · southward Bz는 자기권 결합 강화 · <a href=\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-bz-wind\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap imf-compact\"><canvas id=\"c-bz\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv>\n<div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">WSA–ENLIL Heliospheric Forecast<\u002Fdiv><div class=\"chart-source\">NOAA SWPC ENLIL spatial-distribution image frames · hourly model animation<\u002Fdiv><\u002Fdiv><div id=\"v-enlil\" class=\"live-value\">FORECAST<\u002Fdiv><\u002Fdiv><div class=\"enlil-controls\"><button id=\"enlil-play\" type=\"button\">▶ 재생<\u002Fbutton><button id=\"enlil-prev\" type=\"button\" aria-label=\"Previous ENLIL frame\">◀<\u002Fbutton><button id=\"enlil-next\" type=\"button\" aria-label=\"Next ENLIL frame\">▶<\u002Fbutton><input id=\"enlil-slider\" type=\"range\" min=\"0\" max=\"0\" value=\"0\" step=\"1\" aria-label=\"ENLIL forecast frame\"><div id=\"enlil-readout\" class=\"enlil-readout\">영상 프레임 목록을 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"enlil-frame-shell\"><img id=\"enlil-image\" alt=\"NOAA WSA-ENLIL heliospheric forecast spatial distribution\"><div id=\"enlil-frame-status\" class=\"enlil-frame-status\">ENLIL 공간 분포 영상을 불러오는 중...<\u002Fdiv><div id=\"enlil-time-badge\" class=\"enlil-time-badge\">-- UTC<\u002Fdiv><\u002Fdiv><div class=\"enlil-note\">NOAA가 제공하는 WSA–ENLIL 공간 분포 JPEG 프레임을 시간 순서대로 재생합니다. 프레임 목록이 갱신되지 않았거나 이미지 서버가 응답하지 않으면 마지막으로 공개된 모델 실행 시각까지만 표시됩니다. 이미지를 클릭하면 확대됩니다.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"geomag\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Geomagnetic Activity<\u002Fh2><p>Planetary Kp, GFZ Hp30, Geospace Dst를 시간축으로 비교<\u002Fp><\u002Fdiv><span class=\"interactive-hint\">공통 커서와 현재 시각 표시<\u002Fspan><\u002Fdiv><div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Kp index<\u002Fdiv><div class=\"chart-source\">우측 라벨: NOAA G-scale 기준 G1(Kp 5)–G5(Kp 9) · <a href=\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-kp2\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-kp2\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">GFZ Hp30 Index<\u002Fdiv><div class=\"chart-source\" id=\"hp30-source-status\">30분 해상도 · 최근 7일 · <a id=\"hp30-source-link\" href=\"https://kp.gfz.de/en/hp30-hp60\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">GFZ 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-hp30\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-hp30\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Dst Index<\u002Fdiv><div class=\"chart-source\">nT · <a href=\"https://services.swpc.noaa.gov/json/geospace/geospace_dst_7_day.json\" target=\"_blank\" rel=\"noopener\" style=\"color:#67d6ff\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-dst\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap\"><canvas id=\"c-dst\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"radiation\" class=\"view\"><section class=\"section\">\n  <div class=\"section-head\"><div><h2>Magnetosphere<\u002Fh2><p>Magnetopause 압축 상태와 GOES 입자 플럭스<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"iono-subtabs\" role=\"tablist\" aria-label=\"Magnetosphere product\">\n    <button type=\"button\" class=\"iono-subtab active\" data-iono-view=\"magnetopause\">Magnetopause<\u002Fbutton>\n    <button type=\"button\" class=\"iono-subtab\" data-iono-view=\"magnetopause3d\">Magnetopause 3D<\u002Fbutton>\n    <button type=\"button\" class=\"iono-subtab\" data-iono-view=\"particles\">GOES Energetic Particles<\u002Fbutton>\n  <\u002Fdiv>\n  <div id=\"iono-view-magnetopause\" class=\"iono-subview active\">\n    <div id=\"mp-warning\" class=\"mp-warning hidden\">⚠ Magnetopause가 GOES 지구정지궤도(6.6 Re)보다 안쪽으로 압축되어 있습니다 — 일부 GOES 위성이 태양풍/자기권 경계 바깥에 노출될 수 있습니다.<\u002Fdiv>\n    <div class=\"chart-card\">\n      <div class=\"chart-top\"><div><div class=\"chart-title\">Magnetopause Standoff Distance<\u002Fdiv><div class=\"chart-source\" style=\"width:706px;height:37px\">Shue et al. (1997) 경험모델 · 실시간 solar wind 동압/IMF Bz 기반 계산 · 위성 위치는 지리경도 기반 근사(계절 보정 없음) · <a href=\"https://doi.org/10.1029/97JA00196\" target=\"_blank\" rel=\"noopener\">Shue et al. 1997 원문<\u002Fa> · <a href=\"https://en.wikipedia.org/wiki/Magnetopause\" target=\"_blank\" rel=\"noopener\">Magnetopause 설명<\u002Fa><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end;row-gap:8px\"><div id=\"mp-r0\" style=\"font-size:17px;color:#ffd36b;white-space:nowrap\">자기권계면(r0) = --Re<\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px\"><div id=\"mp-density\" style=\"font-size:17px;color:#9fb0c0;white-space:nowrap\">Density: --<\u002Fdiv><div id=\"mp-speed\" style=\"font-size:17px;color:#9fb0c0;white-space:nowrap\">Speed: --<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"canvas-wrap\" style=\"height:460px;position:relative\"><canvas id=\"c-magnetopause-particles\" style=\"position:absolute;inset:0;width:100%;height:100%\"><\u002Fcanvas><canvas id=\"c-magnetopause\" style=\"position:absolute;inset:0;width:100%;height:100%\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"scale-note\">회색 점선: GOES 지구정지궤도(6.6 Re). 보라색/붉은 곡선: 계산된 magnetopause 경계. 위성 점이 붉은색이면 해당 위치에서 magnetopause 안쪽(태양풍 노출) 상태입니다. r0 = 정오(subsolar) 방향 magnetopause 거리. 배경 입자는 solar wind 속도·밀도를 시각화한 것으로 실제 입자 궤적이 아닙니다.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chart-card\">\n      <div class=\"chart-top\"><div><div class=\"chart-title\">Magnetopause Standoff Distance — 5일<\u002Fdiv><div class=\"chart-source\">Shue 볕식으로 계산된 r0 시간대별 추이<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"canvas-wrap\" style=\"height:220px\"><canvas id=\"c-mp-r0\"><\u002Fcanvas><\u002Fdiv>\n      <div id=\"mp-r0-events\" class=\"scale-note\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"iono-view-magnetopause3d\" class=\"iono-subview\">\n    <div class=\"chart-card\">\n      <div class=\"chart-top\"><div><div class=\"chart-title\">Magnetopause 3D (실험적 프로토타입)<\u002Fdiv><div class=\"chart-source\" style=\"width:692px;height:32px\">Shue 모델을 태양-지구축 기준으로 회전시켜 만든 근사 3D 곡면 · 드래그로 회전, 스크롤로 확대/축소 · <a href=\"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/97JA00196\" target=\"_blank\" rel=\"noopener\">Shue et al. 1997<\u002Fa><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end;row-gap:8px\"><div id=\"mp3d-r0\" style=\"font-size:17px;color:#ffd36b;white-space:nowrap\">자기권계면(r0) = --Re<\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px\"><div id=\"mp3d-density\" style=\"font-size:17px;color:#9fb0c0;white-space:nowrap\">Density: --<\u002Fdiv><div id=\"mp3d-speed\" style=\"font-size:17px;color:#9fb0c0;white-space:nowrap\">Speed: --<\u002Fdiv><\u002Fdiv><div id=\"mp3d-camera\" style=\"font-size:13px;color:#7f93a8;white-space:nowrap\">Cam X:-- Y:-- Z:-- Re<\u002Fdiv><label style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:#9fb0c0;white-space:nowrap;flex-shrink:0\">투명도<input type=\"range\" id=\"mp3d-opacity\" min=\"0.05\" max=\"0.6\" step=\"0.01\" value=\"0.1\" style=\"width:110px\"><\u002Flabel><label style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#9fb0c0;white-space:nowrap;flex-shrink:0\">자기력선(근사)<input type=\"checkbox\" id=\"mp3d-fieldlines\" checked=\"\"><\u002Flabel><\u002Fdiv><\u002Fdiv>\n      <div id=\"mp3d-container\" style=\"height:520px;border-radius:12px;overflow:hidden;background:#050a12;position:relative\"><canvas id=\"mp3d-gizmo\" width=\"120\" height=\"120\" style=\"position:absolute;left:8px;bottom:8px;width:90px;height:90px;pointer-events:none\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"scale-note\">실제 magnetopause는 완전한 회전대칭이 아니며(새벽-저녁 비대칭 등), 이 3D 뷰는 단면 모델을 축 대칭으로 회전시킨 근사 형상입니다.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chart-card\">\n      <div class=\"chart-top\"><div><div class=\"chart-title\">Magnetopause Standoff Distance — 5일<\u002Fdiv><div class=\"chart-source\">Shue 볕식으로 계산된 r0 시간대별 추이<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"canvas-wrap\" style=\"height:220px\"><canvas id=\"c-mp3d-r0\"><\u002Fcanvas><\u002Fdiv>\n      <div id=\"mp3d-r0-events\" class=\"scale-note\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"iono-view-particles\" class=\"iono-subview\">\n    <div class=\"chart-stack\"><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Integral Proton Flux<\u002Fdiv><div class=\"chart-source\">GOES primary · NOAA S-scale는 ≥10 MeV 채널 기준 · <a href=\"https://services.swpc.noaa.gov/json/goes/primary/integral-protons-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-proton\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-proton\"><\u002Fcanvas><\u002Fdiv><div id=\"radiation-sep-list\" style=\"margin-top:12px;display:flex;flex-direction:column;gap:8px\"><\u002Fdiv><\u002Fdiv><div class=\"chart-card\"><div class=\"chart-top\"><div><div class=\"chart-title\">Integral Electron Flux<\u002Fdiv><div class=\"chart-source\">GOES secondary · ≥0.8 MeV and ≥2 MeV · electrons/(cm²·s·sr) · <a href=\"https://services.swpc.noaa.gov/json/goes/secondary/integral-electrons-7-day.json\" target=\"_blank\" rel=\"noopener\">NOAA 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-electron\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv><div class=\"canvas-wrap tall\"><canvas id=\"c-electron\"><\u002Fcanvas><\u002Fdiv><div class=\"scale-note\">NOAA electron alert 기준은 ≥2 MeV flux 1,000 electrons/(cm²·s·sr)입니다. 강한 proton event 동안 ≥2 MeV electron 채널이 오염될 수 있습니다.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection><\u002Fsection>\n<section id=\"ionosphere\" class=\"view\">\n  <section class=\"section\">\n    <div class=\"section-head\">\n      <div><h2>Global Ionosphere<\u002Fh2><p>NOAA SWPC GloTEC ultra-real-time global ionospheric specification · D-RAP HF 전파 감쇄 모델<\u002Fp><\u002Fdiv>\n      <button id=\"reload-ionosphere\" type=\"button\">전리권 자료 새로고침<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"iono-subtabs\" role=\"tablist\" aria-label=\"Ionosphere product\">\n      <button type=\"button\" class=\"iono-subtab active\" data-iono-view=\"tec\">Global TEC (GloTEC)<\u002Fbutton>\n      <button type=\"button\" class=\"iono-subtab\" data-iono-view=\"drap\">HF Radio Absorption (D-RAP)<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"iono-view-tec\" class=\"iono-subview active\">\n    <div class=\"iono-toolbar\">\n      <div id=\"iono-time\" class=\"iono-time\">최신 GloTEC 자료 탐색 중...<\u002Fdiv>\n      <div id=\"iono-status\" class=\"iono-status\">GeoJSON 파일을 확인하고 있습니다.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"iono-controls\" aria-label=\"Ionosphere map controls\">\n      <div class=\"iono-control\"><span>보간 해상도<\u002Fspan><select id=\"iono-resolution\"><option value=\"1\">1×<\u002Foption><option value=\"2\" selected=\"\">2×<\u002Foption><option value=\"4\">4×<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"iono-control\"><span>Gaussian<\u002Fspan><input id=\"iono-smoothing\" type=\"range\" min=\"0\" max=\"5\" step=\"1\" value=\"2\"><output id=\"iono-smoothing-value\">2<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><span>채움 투명도<\u002Fspan><input id=\"iono-opacity\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"100\"><output id=\"iono-opacity-value\">100%<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><span>Contour<\u002Fspan><select id=\"iono-contours\"><option value=\"0\">없음<\u002Foption><option value=\"6\">6<\u002Foption><option value=\"10\" selected=\"\">10<\u002Foption><option value=\"14\">14<\u002Foption><option value=\"20\">20<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"iono-control\"><span>선 투명도<\u002Fspan><input id=\"iono-contour-alpha\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"50\"><output id=\"iono-contour-alpha-value\">50%<\u002Foutput><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-labels\" type=\"checkbox\" checked=\"\"> Contour 라벨<\u002Flabel><\u002Fdiv><div class=\"iono-control\"><label><input id=\"iono-show-map\" type=\"checkbox\" checked=\"\"> 대륙 해안선<\u002Flabel><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-grid\" type=\"checkbox\" checked=\"\"> 위·경도 격자<\u002Flabel><\u002Fdiv>\n      <div class=\"iono-control\"><label><input id=\"iono-show-points\" type=\"checkbox\"> 원본 격자점<\u002Flabel><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"iono-grid\">\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global Total Electron Content<\u002Fdiv><div class=\"chart-source\">Vertical TEC · TECU · <a id=\"iono-source-tec\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-tec-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-tec\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">TEC는 위성–수신기 경로의 전자 수를 수직 방향으로 환산한 총전자량입니다. 1 TECU = 10¹⁶ electrons/m².<\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global NmF2<\u002Fdiv><div class=\"chart-source\">F2-layer peak electron density · <a id=\"iono-source-nmf2\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-nmf2-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-nmf2\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">NmF2는 전리권 F2층 최대 전자밀도입니다. 자료값이 m⁻³ 단위이면 지도에는 10¹² m⁻³ 단위로 환산해 표시합니다.<\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"iono-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">Global hmF2<\u002Fdiv><div class=\"chart-source\">F2-layer peak height · km · <a id=\"iono-source-hmf2\" href=\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\" target=\"_blank\" rel=\"noopener\">NOAA GloTEC 원본 데이터<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"iono-hmf2-range\" class=\"live-value\">--<\u002Fdiv><\u002Fdiv>\n        <div class=\"iono-map-wrap\"><canvas id=\"c-iono-hmf2\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"iono-legend-note\">hmF2는 F2층 최대 전자밀도가 나타나는 고도입니다.<\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"iono-view-drap\" class=\"iono-subview\">\n      <div class=\"chart-card\">\n        <div class=\"chart-top\"><div><div class=\"chart-title\">D-RAP Global HF Absorption<\u002Fdiv><div class=\"chart-source\">NOAA SWPC D-Region Absorption Predictions · 최대 사용 가능 주파수(MHz) 전지구 분포 · <a href=\"https://services.swpc.noaa.gov/text/drap_global_frequencies.txt\" target=\"_blank\" rel=\"noopener\">원본 수치 데이터<\u002Fa> · <a href=\"https://services.swpc.noaa.gov/images/animations/d-rap/global/\" target=\"_blank\" rel=\"noopener\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Fdiv><div id=\"v-drap\" class=\"live-value\">MODEL<\u002Fdiv><\u002Fdiv>\n        <div class=\"enlil-controls\"><button id=\"drap-play\" type=\"button\">▶ 재생<\u002Fbutton><button id=\"drap-prev\" type=\"button\" aria-label=\"Previous D-RAP frame\">◀<\u002Fbutton><button id=\"drap-next\" type=\"button\" aria-label=\"Next D-RAP frame\">▶<\u002Fbutton><input id=\"drap-slider\" type=\"range\" min=\"0\" max=\"0\" value=\"0\" step=\"1\" aria-label=\"D-RAP frame\"><div id=\"drap-readout\" class=\"enlil-readout\">영상 프레임 목록을 불러오는 중...<\u002Fdiv><\u002Fdiv>\n        <div class=\"enlil-frame-shell\"><img id=\"drap-image\" alt=\"NOAA D-RAP global HF absorption map\"><div id=\"drap-frame-status\" class=\"enlil-frame-status\">D-RAP 영상을 불러오는 중...<\u002Fdiv><\u002Fdiv>\n        <div class=\"enlil-note\">NOAA D-RAP 모델은 태양 플레어로 인한 X선 증가 시 전리권 D층 흡수 정도를 최대 사용 가능 주파수(MHz)로 환산해 전지구 지도로 제공합니다. 값이 낮을수록(붉은색) 해당 위치의 HF 통신 감쇄가 심함을 의미합니다. 이미지를 클릭하면 확대됩니다.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsection>\n<section id=\"imagery\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>Latest Solar Images<\u002Fh2><p>NOAA GOES/SUVI 및 SDO AIA/HMI 최신 영상 · 클릭하면 확대<\u002Fp><\u002Fdiv><button id=\"reload-solar-images\" type=\"button\">이미지 다시 불러오기<\u002Fbutton><\u002Fdiv><div class=\"images\"><article class=\"image-card\" data-label=\"GOES SUVI 171 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/171/latest.png\" alt=\"Latest GOES SUVI 171 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI 171 Å · quiet corona · <a href=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/171/latest.png\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"GOES SUVI 195 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/195/latest.png\" alt=\"Latest GOES SUVI 195 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI 195 Å · corona · <a href=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/195/latest.png\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"GOES SUVI 304 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/304/latest.png\" alt=\"Latest GOES SUVI 304 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI 304 Å · chromosphere · <a href=\"https://services.swpc.noaa.gov/images/animations/suvi/primary/304/latest.png\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO AIA 335 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_0335.jpg\" alt=\"Latest SDO AIA 335 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/AIA 335 Å · active regions · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_0335.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO AIA 1600 Å\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_1600.jpg\" alt=\"Latest SDO AIA 1600 angstrom image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/AIA 1600 Å · transition region/upper photosphere · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_1600.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO HMI Continuum\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/sdo-hmii/latest.jpg\" alt=\"Latest SDO HMI continuum image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/HMI continuum · photosphere · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIIC.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"SDO HMI Magnetogram\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIB.jpg\" alt=\"Latest SDO HMI magnetogram image\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">SDO/HMI magnetogram · photospheric magnetic field · <a href=\"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIB.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><article class=\"image-card\" data-label=\"GOES SUVI Thematic Map\"><div class=\"solar-image-wrap\"><img data-base-src=\"https://services.swpc.noaa.gov/images/animations/suvi/secondary/map/latest.png\" alt=\"Latest GOES SUVI thematic map\" referrerpolicy=\"no-referrer\"><div class=\"solar-image-status\">이미지 불러오는 중...<\u002Fdiv><\u002Fdiv><div class=\"image-caption\">GOES/SUVI Thematic Map · <a href=\"https://services.swpc.noaa.gov/images/animations/suvi/secondary/map/latest.png\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 링크<\u002Fa><\u002Fdiv><\u002Farticle><\u002Fdiv><\u002Fsection><\u002Fsection>\n<section id=\"aurora\" class=\"view\"><div class=\"iframe-shell\"><div class=\"iframe-bar\"><div><strong>OVATION Aurora Monitoring<\u002Fstrong><br><span>Geographic probability + MLT–MLAT energy flux<\u002Fspan><\u002Fdiv><button id=\"open-aurora\">새 탭에서 열기 ↗<\u002Fbutton><\u002Fdiv><iframe id=\"aurora-frame\" src=\"about:blank#9aea7852-9a4d-414e-b33a-b1c16ecd3d39\" title=\"OVATION Aurora Monitoring\"><\u002Fiframe><\u002Fdiv><\u002Fsection>\n<section id=\"report\" class=\"view\"><section class=\"section\"><div class=\"section-head\"><div><h2>우주환경리포트 제출<\u002Fh2><p>실시간 수집 데이터를 기반으로 리포트를 요약 및 작성하고, 저장·다운로드를 할 수 있습니다.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"padding:24px;border:1px solid var(--border);border-radius:16px;background:rgba(9,17,29,.6);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center\"><p style=\"color:var(--muted);max-width:730px;margin:0\">현재 수집된 Kp, Dst, Solar Wind, Bz, X-ray, Proton Flux 및 최근 CME/Flare/지자기폭풍/태양 양성자 이벤트를 시스템이 자동 요약해 리포트 초안을 제공하며, 보고자는 요약을 참고하여 최종 리포트를 작성합니다.<br><br>* 아래 작성 버튼 클릭시 로그인<\u002Fp><div style=\"display:flex;gap:10px\"><button type=\"button\" id=\"report-open-btn\" class=\"details-btn\" style=\"font-size:16px;padding:12px 28px\">작성<\u002Fbutton><button type=\"button\" id=\"report-logout-btn\" class=\"details-btn\" style=\"font-size:14px;padding:12px 20px;display:none\">로그아웃<\u002Fbutton><\u002Fdiv><\u002Fdiv><div style=\"margin-top:20px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;justify-content:center\"><div id=\"report-calendar\" style=\"min-width:280px\"><\u002Fdiv><div style=\"flex:1;min-width:300px;max-width:640px;text-align:left\"><div id=\"report-week-label\" style=\"font-weight:600;margin-bottom:8px\"><\u002Fdiv><div id=\"report-tab-list\" style=\"display:flex;flex-direction:column;gap:8px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fsection>Data sources: NOAA SWPC planetary K-index, Geospace Dst, RTSW solar wind and magnetic field, GOES X-ray, proton, and electron feeds, GloTEC ionosphere GeoJSON; NASA SDO latest imagery; GFZ Kp and Hp30 index.\n<\u002Fmain>\n<div id=\"modal\" class=\"modal\"><div class=\"modal-inner\"><button id=\"modal-close\">닫기<\u002Fbutton><img id=\"modal-img\" alt=\"Expanded solar image\"><\u002Fdiv><\u002Fdiv>\n<div id=\"cactus-modal\" class=\"modal\"><div class=\"modal-inner cactus-modal-inner\"><button id=\"cactus-modal-close\">닫기<\u002Fbutton><div id=\"cactus-modal-body\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div id=\"report-modal\" class=\"modal\"><div class=\"modal-inner cactus-modal-inner report-modal-inner\"><button id=\"report-modal-close\" style=\"position:absolute;top:16px;right:16px;z-index:5\">닫기<\u002Fbutton><div id=\"report-modal-body\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div id=\"report-view-modal\" class=\"modal\"><div class=\"modal-inner cactus-modal-inner report-modal-inner\"><button id=\"report-view-modal-close\" style=\"position:absolute;top:16px;right:16px;z-index:5\">닫기<\u002Fbutton><div id=\"report-view-modal-body\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div id=\"report-login-modal\" class=\"modal\"><div class=\"modal-inner\" style=\"max-width:760px;padding:56px;background:#101a28;opacity:1;border:none;border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.65)\"><h4 style=\"margin:0 0 24px;color:#fff;font-size:26px\">로그인<\u002Fh4><div id=\"report-login-error\" style=\"color:var(--warn);font-size:16px;margin-bottom:14px;display:none\">ID 또는 비밀번호가 올바르지 않습니다.<\u002Fdiv><label style=\"display:block;margin-bottom:20px;font-size:18px;font-weight:600;color:#fff\">ID<input id=\"report-login-id\" type=\"text\" autocomplete=\"off\" style=\"width:100%;margin-top:8px;background:#ffffff;color:#111318;border:1px solid var(--accent);border-radius:14px;padding:16px 18px;font-size:18px\"><\u002Flabel><label style=\"display:block;margin-bottom:24px;font-size:18px;font-weight:600;color:#fff\">PW<input id=\"report-login-pw\" type=\"password\" autocomplete=\"off\" style=\"width:100%;margin-top:8px;background:#ffffff;color:#111318;border:1px solid var(--accent);border-radius:14px;padding:16px 18px;font-size:18px\"><\u002Flabel><div style=\"display:flex;gap:12px;justify-content:flex-end\"><button id=\"report-login-cancel\" type=\"button\" class=\"details-btn\" style=\"font-size:16px;padding:12px 24px;border-radius:14px\">취소<\u002Fbutton><button id=\"report-login-submit\" type=\"button\" class=\"details-btn\" style=\"font-size:16px;padding:12px 24px;border-radius:14px\">로그인<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<script async=\"\" src=\"2071a9f1-cf75-4e65-87f0-455f1ae4fa4a\" onload=\"window.dispatchEvent(new Event('topojsonready'))\"><\u002Fscript>\n<script src=\"dd6cdbc3-5af6-4303-985c-b534c2a082f5\"><\u002Fscript>\n<script src=\"279dc8ba-4d6f-414c-bfea-5dff73876b6e\"><\u002Fscript>\n<script>\n\"use strict\";\nconst ENDPOINTS={scales:\"https://services.swpc.noaa.gov/products/noaa-scales.json\",kp:\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json\",kpForecast:\"https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json\",dst:\"https://services.swpc.noaa.gov/json/geospace/geospace_dst_7_day.json\",wind:\"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json\",mag:\"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json\",xray:\"https://services.swpc.noaa.gov/json/goes/primary/xrays-7-day.json\",xrayFallback:\"https://services.swpc.noaa.gov/json/goes/primary/xrays-1-day.json\",proton:\"https://services.swpc.noaa.gov/json/goes/primary/integral-protons-7-day.json\",electron:\"https://services.swpc.noaa.gov/json/goes/secondary/integral-electrons-7-day.json\",glotecManifest:\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt.json\",glotecBase:\"https://services.swpc.noaa.gov/products/glotec/geojson_2d_urt/\",enlil:\"https://services.swpc.noaa.gov/products/animations/enlil.json\",drap:\"https://services.swpc.noaa.gov/images/animations/d-rap/global/\",goesLon:\"https://services.swpc.noaa.gov/json/goes/satellite-longitudes.json\"};\nconst state={data:{},loading:false,enlilIndex:0,enlilPlaying:false,enlilTimer:null,drapIndex:0,drapPlaying:false,drapTimer:null};const $=id=>document.getElementById(id);\nfunction donkiRange(days){const end=new Date(),start=new Date(end.getTime()-days*864e5),f=x=>x.toISOString().slice(0,10);return {start:f(start),end:f(end)}}\nfunction buildDonkiUrl(type,days=3){const {start,end}=donkiRange(days);return `https://kauai.ccmc.gsfc.nasa.gov/DONKI/WS/get/${type}?startDate=${start}&endDate=${end}`}\nfunction fetchDonki(type,days=3){\n  const local=`./data/donki/${type.toLowerCase()}.json`;\n  const direct=buildDonkiUrl(type,days),nonce=Date.now();\n  const fallbacks=[`${local}?t=${nonce}`,direct,`https://api.allorigins.win/raw?url=${encodeURIComponent(direct)}&cache=${nonce}`,`https://corsproxy.io/?url=${encodeURIComponent(direct)}&cache=${nonce}`];\n  return safeFetchAny(fallbacks);\n}\nfunction parseCactusText(text){\n  const cme=[],flow=[];let inFlow=false;\n  for(const raw of String(text||'').split('\\n')){\n    const line=raw.trim();if(!line)continue;\n    if(/^#\\s*Flow\\s*\\|/i.test(line)){inFlow=true;continue}\n    if(line.startsWith('#')||line.startsWith(':'))continue;\n    const parts=line.split('|').map(s=>s.trim());\n    if(parts.length<9||!/^\\d+$/.test(parts[0]))continue;\n    const [numStr,t0Str,dt0,pa,da,v,dv,minv,maxv,halo]=parts;\n    const t0=Date.parse(t0Str.replace(/\\//g,'-').replace(' ','T')+':00Z');\n    if(!Number.isFinite(t0))continue;\n    (inFlow?flow:cme).push({cme:numStr,t0,dt0:Number(dt0),pa:Number(pa),da:Number(da),v:Number(v),dv:Number(dv),minv:Number(minv),maxv:Number(maxv),halo:(halo||'').trim()||null});\n  }\n  cme.sort((a,b)=>b.t0-a.t0);flow.sort((a,b)=>b.t0-a.t0);\n  return{cme,flow};\n}\nasync function fetchCactus(){\n  const nonce=Date.now();\n  try{const r=await fetch(`./data/cactus/cmecat.json?t=${nonce}`,{cache:'no-store'});if(r.ok){const j=await r.json();return Array.isArray(j)?{cme:j,flow:[]}:{cme:j.cme||[],flow:j.flow||[]}}}catch(e){}\n  const direct='https://www.sidc.be/cactus/out/cmecat.txt';\n  const urls=[direct,`https://api.allorigins.win/raw?url=${encodeURIComponent(direct)}&cache=${nonce}`,`https://corsproxy.io/?url=${encodeURIComponent(direct)}&cache=${nonce}`];\n  let lastError=null;\n  for(const u of urls){\n    try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return parseCactusText(await r.text())}catch(e){lastError=e}\n  }\n  throw lastError||new Error('CACTUS unavailable');\n}\nfunction detectEpisodes(series,threshold,mergeGapMs){\n  const pts=(series||[]).filter(p=>Number.isFinite(p.v)&&p.v>=threshold).sort((a,b)=>a.t-b.t);\n  const episodes=[];\n  for(const p of pts){\n    const last=episodes[episodes.length-1];\n    if(last&&p.t-last.end<=mergeGapMs){last.end=p.t;last.max=Math.max(last.max,p.v)}\n    else episodes.push({start:p.t,end:p.t,max:p.v});\n  }\n  return episodes;\n}\nfunction gScale(kp){return kp>=9?'G5':kp>=8?'G4':kp>=7?'G3':kp>=6?'G2':kp>=5?'G1':null}\nfunction sScale(pfu){return pfu>=1e5?'S5':pfu>=1e4?'S4':pfu>=1e3?'S3':pfu>=100?'S2':pfu>=10?'S1':null}\nfunction buildReportSummary(){\n  const d=state.data,kpP=latestPoint(d.kp),dstP=latestPoint(d.dst),speedP=latestPoint(d.speed),densityP=latestPoint(d.density),bzP=latestPoint(d.bz),xP=latestPoint(d.xray),protonP=latestPoint(d.proton);\n  const kp=kpP?.v,dst=dstP?.v,speed=speedP?.v,density=densityP?.v,bz=bzP?.v,x=xP?.v,proton=protonP?.v;\n  const s=d.scales||{};\n  const now=new Date().toISOString().slice(0,16).replace('T',' ')+' UTC';\n  const cutoff24=Date.now()-864e5;\n  const stats=(series)=>{const a=(series||[]).filter(p=>p.t>=cutoff24).map(p=>p.v).filter(Number.isFinite);if(!a.length)return null;return{min:Math.min(...a),max:Math.max(...a),avg:a.reduce((s,v)=>s+v,0)/a.length}};\n  const fmtNum=(v,digits)=>Number.isFinite(v)?v.toFixed(digits):'-';\n  const padRow=(cols,widths)=>cols.map((c,i)=>String(c).padEnd(widths[i])).join(' | ');\n  const buildTable=(headers,rows)=>{const widths=headers.map((h,i)=>Math.max(h.length,...rows.map(r=>String(r[i]).length)));const sep=widths.map(w=>'-'.repeat(w)).join('-|-');return[padRow(headers,widths),sep,...rows.map(r=>padRow(r,widths))].join('\\n')};\n  const cactusCutoff=Date.now()-5*864e5;\n  const cme=(d.cme||[]).filter(e=>e.t0>=cactusCutoff).slice().sort((a,b)=>b.t0-a.t0).slice(0,5);\n  const flr=(d.flr||[]).slice().sort((a,b)=>new Date(b.beginTime)-new Date(a.beginTime)).slice(0,5);\n  const gstEp=detectEpisodes((d.kp||[]).filter(p=>p.t>Date.now()-5*864e5),5,6*36e5).sort((a,b)=>b.start-a.start).slice(0,5);\n  const sepEp=detectEpisodes((d.proton||[]).filter(p=>p.t>Date.now()-5*864e5),10,2*36e5).sort((a,b)=>b.start-a.start).slice(0,5);\n  const lines=[];\n  lines.push(`작성 시각: ${now}`);\n  lines.push('');\n  lines.push('[최근 24시간 요약]');\n  const rows24=[\n    ['Kp',stats(d.kp),1,''],\n    ['Dst',stats(d.dst),0,'nT'],\n    ['Solar Wind Speed',stats(d.speed),0,'km/s'],\n    ['Proton Density',stats(d.density),1,'/cm³'],\n    ['IMF Bz',stats(d.bz),1,'nT'],\n    ['Proton Flux (≥10 MeV)',stats(d.proton),1,'pfu']\n  ].map(([name,st,digits,unit])=>[name,st?fmtNum(st.min,digits):'-',st?fmtNum(st.max,digits):'-',st?fmtNum(st.avg,digits):'-',unit||'-']);\n  lines.push(buildTable(['항목','최저','최대','평균','단위'],rows24));\n  lines.push('');\n  lines.push('[현재 지표]');\n  lines.push(`Planetary Kp: ${fmt(kp,1)}`);\n  lines.push(`Dst Index: ${fmt(dst,0)} nT`);\n  lines.push(`Solar Wind Speed: ${fmt(speed,0)} km/s`);\n  lines.push(`Proton Density: ${fmt(density,1)} /cm³`);\n  lines.push(`IMF Bz: ${fmt(bz,1)} nT`);\n  lines.push(`GOES X-ray Flux: ${Number.isFinite(x)?(10**x).toExponential(2):'--'} W/m² (${xrayClass(x)})`);\n  lines.push(`Proton Flux (≥10 MeV): ${fmt(proton,1)} pfu`);\n  lines.push('');\n  lines.push('[NOAA Space Weather Scales]');\n  lines.push(`R (Radio Blackout): R${s.R??0} · S (Solar Radiation Storm): S${s.S??0} · G (Geomagnetic Storm): G${s.G??0}`);\n  lines.push('');\n  lines.push('[CME - CACTUS 자동 검출, 최근 5일]');\n  lines.push(cme.length?cme.map(e=>`- #${e.cme} ${new Date(e.t0).toISOString().slice(0,16).replace('T',' ')} UTC · ${e.v}km/s · PA${e.pa}° · width${e.da}°${e.halo?` · HALO ${e.halo}`:''}`).join('\\n'):'- 없음');\n  lines.push('');\n  lines.push('[Solar Flare - NASA DONKI, 최근 7일]');\n  lines.push(flr.length?flr.map(e=>`- ${e.classType||'?'} · ${e.beginTime?new Date(e.beginTime).toISOString().slice(0,16).replace('T',' '):'--'} UTC · AR${e.activeRegionNum||'-'}`).join('\\n'):'- 없음');\n  lines.push('');\n  lines.push('[Geomagnetic Storm - Kp 실시간 감지, 최근 5일]');\n  lines.push(gstEp.length?gstEp.map(e=>`- ${gScale(e.max)} · Kp ${e.max.toFixed(1)} · 시작 ${new Date(e.start).toISOString().slice(0,16).replace('T',' ')} UTC`).join('\\n'):'- 없음');\n  lines.push('');\n  lines.push('[Solar Proton Events - proton flux 실시간 감지, 최근 5일]');\n  lines.push(sepEp.length?sepEp.map(e=>`- ${sScale(e.max)} · ${e.max.toFixed(0)} pfu · 시작 ${new Date(e.start).toISOString().slice(0,16).replace('T',' ')} UTC`).join('\\n'):'- 없음');\n  return lines.join('\\n');\n}\nfunction combineReportText(author,reviewer,summary,notes){\n  return `우주환경 리포트 (Space Weather Report)\\n보고자: ${author||'-'}\\n검토자: ${reviewer||'-'}\\n\\n${summary}\\n\\n${'='.repeat(44)}\\n[보고자 작성 의견]\\n${notes||'(내용 없음)'}`;\n}\nfunction reportHistory(){try{return JSON.parse(localStorage.getItem('swx-report-history')||'[]')}catch(e){return[]}}\nfunction saveReportHistory(list){try{localStorage.setItem('swx-report-history',JSON.stringify(list.slice(0,30)))}catch(e){}}\nfunction weekRangeFor(date){\n  // Week runs Thursday -> Wednesday\n  const d=new Date(date);d.setHours(0,0,0,0);\n  const day=d.getDay(); // 0=Sun..6=Sat\n  const diffToThu=(day-4+7)%7;\n  const start=new Date(d);start.setDate(d.getDate()-diffToThu);\n  const end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);\n  return{start,end};\n}\nfunction fmtYmd(d){return d.toISOString().slice(0,10)}\nconst reportCalState={monthDate:new Date(),selectedDate:new Date()};\nfunction renderReportCalendar(){\n  const box=$('report-calendar');if(!box)return;\n  const md=reportCalState.monthDate,year=md.getFullYear(),month=md.getMonth();\n  const firstDay=new Date(year,month,1),startWeekday=firstDay.getDay();\n  const daysInMonth=new Date(year,month+1,0).getDate();\n  const {start:wkStart,end:wkEnd}=weekRangeFor(reportCalState.selectedDate);\n  const cells=[];\n  const prevMonthLastDate=new Date(year,month,0).getDate();\n  for(let i=0;i<startWeekday;i++){\n    const day=prevMonthLastDate-startWeekday+1+i;\n    const cellDate=new Date(year,month-1,day);\n    const inWeek=cellDate>=new Date(wkStart.getFullYear(),wkStart.getMonth(),wkStart.getDate())&&cellDate<=new Date(wkEnd.getFullYear(),wkEnd.getMonth(),wkEnd.getDate());\n    cells.push(`<div data-cal-day=\"${fmtYmd(cellDate)}\" style=\"text-align:center;padding:7px 0;border-radius:8px;cursor:pointer;font-size:13px;opacity:.22;color:var(--muted);${inWeek?'background:rgba(109,214,255,.22);color:var(--text);font-weight:700;opacity:.55':''}\">${day}<\u002Fdiv>`);\n  }\n  for(let day=1;day<=daysInMonth;day++){\n    const cellDate=new Date(year,month,day);\n    const inWeek=cellDate>=new Date(wkStart.getFullYear(),wkStart.getMonth(),wkStart.getDate())&&cellDate<=new Date(wkEnd.getFullYear(),wkEnd.getMonth(),wkEnd.getDate());\n    const isToday=fmtYmd(cellDate)===fmtYmd(new Date());\n    cells.push(`<div data-cal-day=\"${fmtYmd(cellDate)}\" style=\"text-align:center;padding:7px 0;border-radius:8px;cursor:pointer;font-size:13px;${inWeek?'background:rgba(109,214,255,.22);color:#fff;font-weight:700':'color:#fff'};${isToday&&!inWeek?'border:1px solid var(--accent)':''}\">${day}<\u002Fdiv>`);\n  }\n  const totalCells=startWeekday+daysInMonth;\n  const trailing=(7-(totalCells%7))%7;\n  for(let day=1;day<=trailing;day++){\n    const cellDate=new Date(year,month+1,day);\n    const inWeek=cellDate>=new Date(wkStart.getFullYear(),wkStart.getMonth(),wkStart.getDate())&&cellDate<=new Date(wkEnd.getFullYear(),wkEnd.getMonth(),wkEnd.getDate());\n    cells.push(`<div data-cal-day=\"${fmtYmd(cellDate)}\" style=\"text-align:center;padding:7px 0;border-radius:8px;cursor:pointer;font-size:13px;opacity:.22;color:var(--muted);${inWeek?'background:rgba(109,214,255,.22);color:var(--text);font-weight:700;opacity:.55':''}\">${day}<\u002Fdiv>`);\n  }\n  box.innerHTML=`<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px\"><button type=\"button\" id=\"cal-prev\" class=\"details-btn\" style=\"padding:4px 10px\">‹<\u002Fbutton><div style=\"font-weight:600\">${year}년 ${month+1}월<\u002Fdiv><button type=\"button\" id=\"cal-next\" class=\"details-btn\" style=\"padding rm=rawRows.map(normalizeRegion).filter(r=>r.ar!=='-');solarRegionHistoryData=rawRows;\n    const latestDate=norm.map(r=>r.observed.slice(0,10)).filter(Boolean).sort().pop()||'';\n    const candidates=latestDate?norm.filter(r=>r.observed.startsWith(latestDate)):norm;\n    const byAr=new Map();for(const r of candidates){const old=byAr.get(String(r.ar));if(!old||r.observed>old.observed)byAr.set(String(r.ar),r)}\n    solarRegionsData=[...byAr.values()].sort((a,b)=>(b.x*100+b.m*10+b.area)-(a.x*100+a.m*10+a.area));\n    renderRegionCards();drawSolarDisk();status.textContent=`Updated · ${solarRegionsData.length} active regions · ${latestDate||'latest'}`;\n    if(solarRegionsData.length){const keep=solarRegionsData.find(r=>selectedRegion&&String(r.ar)===String(selectedRegion.ar));showRegionDetail(keep||solarRegionsData[0])}\n  }catch(e){status.textContent='Failed to load active regions';console.error(e)}\n}\nconst disk=document.getElementById('solar-disk');if(disk){disk.addEventListener('mousemove',ev=>{const r=disk.getBoundingClientRect(),x=(ev.clientX-r.left)*(disk.width/r.width),y=(ev.clientY-r.top)*(disk.height/r.height);disk.style.cursor=(disk._markers||[]).some(m=>Math.hypot(m.x-x,m.y-y)<=m.r)?'pointer':'zoom-in'});disk.addEventListener('click',ev=>{const r=disk.getBoundingClientRect(),x=(ev.clientX-r.left)*(disk.width/r.width),y=(ev.clientY-r.top)*(disk.height/r.height),hit=(disk._markers||[]).find(m=>Math.hypot(m.x-x,m.y-y)<=m.r);if(hit){showRegionDetail(hit.data);return}const img=document.getElementById('solar-disk-image');if(img&&img.src){document.getElementById('modal-img').src=img.src;document.getElementById('modal-img').alt='Latest NASA SDO HMI continuum solar disk';document.getElementById('modal').classList.add('open')}})}\nloadSolarProbabilities();\nPromise.allSettled([loadSunspotReport(),loadSolarRegions()]).then(()=>loadSolarRegions());\nloadSolarDiskImage();\nsetInterval(loadSolarProbabilities,30*60*1000);setInterval(()=>{loadSunspotReport().then(loadSolarRegions)},60*60*1000);setInterval(loadSolarDiskImage,10*60*1000);\n\nwindow.addEventListener('resize',()=>requestAnimationFrame(()=>drawSolarDisk()));\nsetTimeout(()=>drawSolarDisk(),1500);\nsetTimeout(()=>drawSolarDisk(),3500);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
